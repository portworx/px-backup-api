// RestoreCRCleanupObject stores information needed to delete restore CR files
// from backup locations. This is used for background cleanup of restore CR files
// for failed or partial success restores.
// The metadata.name field stores the restore CR file name (e.g., "restore-name-abc1234")
message RestoreCRCleanupObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    // Reference to the backup location where the restore CR file is stored
    ObjectRef backup_location_ref = 2;
    // Timestamp when the retention period expires (only for object lock enabled backup locations)
    // If not set or zero, the file can be deleted immediately
    google.protobuf.Timestamp retention_expiry_time = 3;
}



// ClusterDiscoveryConfigType identifies the type of discovery configuration.
// This enum enables polymorphic handling of different discovery implementations.
enum ClusterDiscoveryConfigType {
    // Invalid or unspecified discovery config type.
    ClusterDiscoveryConfigTypeInvalid = 0;
    // Represents all discovery config types. Used in enumerate/filter requests
    // to return configs of all types.
    ClusterDiscoveryConfigTypeAll = 1;
    // Shoot discovery configuration for Gardener Shoot clusters.
    ClusterDiscoveryConfigTypeShoot = 2;
}

// ShootDiscoveryConfigInfo contains Gardener-specific configuration for discovering Shoot clusters.
message ShootDiscoveryConfigInfo {
    // Gardener API server kubeconfig for authenticating with Gardener.
    string gardener_kubeconfig = 1 [ (gogoproto.moretags) = "secure:\"true\"" ];
    // Gardener project name to discover Shoot clusters from.
    string project_name = 2;
    // Output only. Gardener project ID resolved from project_name during
    // API processing. This field is ignored in create/update requests.
    string project_id = 3;
    // Label selector string to filter Shoot clusters during discovery.
    // Supports Kubernetes label selector syntax, e.g.:
    // "environment in (production, staging),team=platform,!deprecated"
    string label_selector = 4;
}

// ClusterDiscoverySettings contains common settings that apply to all discovery types.
// This message is embedded in ClusterDiscoveryConfigInfo to provide reusable lifecycle
// and polling configuration for any discovery provider.
message ClusterDiscoverySettings {
    // Enable or disable automatic discovery.
    // Uses BoolValue wrapper to distinguish between "not provided" (nil) and
    // "explicitly set to false" during update operations.
    google.protobuf.BoolValue auto_discover = 1;
    // Frequency of automatic discovery when auto_discover is enabled.
    // Discovery is executed based on the creation time plus this interval.
    AutoDiscoverFrequency auto_discover_frequency = 2;

    // AutoDiscoverFrequency specifies the interval for automatic discovery
    // using days, hours, and minutes. The total interval is calculated as:
    // (days * 24 * 60) + (hours * 60) + minutes
    // Minimum allowed interval is 15 minutes.
    message AutoDiscoverFrequency {
        // Number of days between discovery runs (0-365).
        uint32 days = 1;
        // Number of hours between discovery runs (0-23).
        uint32 hours = 2;
        // Number of minutes between discovery runs (0-59).
        // Note: The total interval must be at least 15 minutes.
        uint32 minutes = 3;
    }
}

// ClusterDiscoveryConfigInfo is a polymorphic wrapper for different discovery configuration types.
// Use the type field to determine which config variant is set.
// Common discovery settings are provided via the settings field.
message ClusterDiscoveryConfigInfo {
    // Type of discovery configuration.
    ClusterDiscoveryConfigType type = 1;
    // Type-specific configuration. Only one should be set based on the type field.
    oneof config {
        // Configuration for Gardener Shoot cluster discovery.
        ShootDiscoveryConfigInfo shoot_config = 2;
        // Future discovery config types can be added here, e.g.:
        // VMDiscoveryConfigInfo vm_config = 3;
    }
    // Common discovery settings (polling frequency, auto-discover toggle) that apply to all discovery types.
    ClusterDiscoverySettings settings = 4;
    // Timestamp of the last automatic discovery run.
    google.protobuf.Timestamp last_auto_discovery_time = 5;
    // Timestamp of the last manually triggered discovery run.
    google.protobuf.Timestamp last_manual_discovery_time = 6;
    // Statistics from the last discovery run.
    DiscoveryStats discovery_stats = 7;
    // Status information for the discovery configuration.
    StatusInfo status = 8;
    // Status information for the manual refresh operation.
    // This is separate from the main status to allow both operations — discovery and refresh —
    // to run and be tracked independently.
    RefreshStatusInfo refresh_status = 9;

    // Statistics from discovery runs.
    message DiscoveryStats {
        // Number of clusters discovered in the last discovery run.
        uint32 last_discovered_clusters_count = 1;
        // Number of clusters deleted/de-boarded in the last discovery run.
        uint32 last_deleted_clusters_count = 2;
        // Number of clusters that fell out of the label selector match (labels removed/changed on the cluster side, so they no longer match the discovery config's label_selector).
        uint32 last_unmanaged_clusters_count = 3;
        // Number of clusters that came back into the label selector match (labels added/restored so they match again) in last discovery run.
        uint32 last_remanaged_clusters_count = 4;
        // Number of clusters skipped in the last discovery run.
        uint32 last_skipped_clusters_count = 5;
        // Number of clusters that failed in the last discovery run.
        uint32 last_failed_clusters_count = 6;

        // Total number of clusters associated with this discovery configuration.
        uint32 current_associated_clusters_count = 7;
        // Total number of unmanaged clusters for this discovery configuration.
        uint32 current_unmanaged_clusters_count = 8;
    }

    // Message for maintaining status of the discovery configuration.
    message StatusInfo {
        Status status = 1;
        string reason = 2;

        enum Status {
            Invalid = 0;
            Inprogress = 1;
            Success = 2;
            Failed = 3;
            Deleting = 4;
            DeletePending = 5;
        }
    }

    // Message for maintaining status of the manual refresh operation.
    message RefreshStatusInfo {
        RefreshStatus status = 1;
        string reason = 2;
        // Number of clusters that have been processed (refreshed) so far.
        uint32 processed = 3;
        // Total number of clusters that need to be refreshed.
        uint32 total = 4;

        enum RefreshStatus {
            Invalid = 0;
            Inprogress = 1;
            Success = 2;
            Failed = 3;
        }
    }
}

// ClusterDiscoveryConfigObject represents a discovery configuration with metadata.
message ClusterDiscoveryConfigObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    ClusterDiscoveryConfigInfo cluster_discovery_config_info = 2;
}

// ClusterDiscoveryConfig service provides CRUD operations for discovery configurations.
// This is a generic service that supports multiple cluster discovery types
service ClusterDiscoveryConfig {
    // Create creates a new cluster discovery configuration.
    rpc Create(ClusterDiscoveryConfigCreateRequest)
        returns (ClusterDiscoveryConfigCreateResponse) {
        option (google.api.http) = {
            post : "/v1/clusterdiscoveryconfig"
            body : "*"
        };
    }

    // Update patches an existing cluster discovery configuration.
    rpc Update(ClusterDiscoveryConfigUpdateRequest)
        returns (ClusterDiscoveryConfigUpdateResponse) {
        option (google.api.http) = {
            patch : "/v1/clusterdiscoveryconfig"
            body : "*"
        };
    }

    // Enumerate returns a list of cluster discovery configurations.
    rpc Enumerate(ClusterDiscoveryConfigEnumerateRequest)
        returns (ClusterDiscoveryConfigEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/clusterdiscoveryconfig/{org_id}"
        };
    }

    // Inspect returns details of a specific cluster discovery configuration.
    rpc Inspect(ClusterDiscoveryConfigInspectRequest)
        returns (ClusterDiscoveryConfigInspectResponse) {
        option (google.api.http) = {
            get : "/v1/clusterdiscoveryconfig/{org_id}/{name}"
        };
    }

    // Delete removes a cluster discovery configuration.
    rpc Delete(ClusterDiscoveryConfigDeleteRequest)
        returns (ClusterDiscoveryConfigDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/clusterdiscoveryconfig/{org_id}/{name}"
        };
    }

    // DiscoverClusters manually initiates discovery for the specified configuration.
    // The discovery runs asynchronously; use Inspect to check progress via StatusInfo.
    rpc DiscoverClusters(ClusterDiscoveryConfigDiscoverClustersRequest)
        returns (ClusterDiscoveryConfigDiscoverClustersResponse) {
        option (google.api.http) = {
            post : "/v1/clusterdiscoveryconfig/{org_id}/{name}/discover"
            body : "*"
        };
    }

    // RefreshClusters manually triggers an on-demand credential refresh for all
    // clusters associated with the specified ClusterDiscoveryConfig.
    // For Gardener Shoot clusters, this refreshes the kubeconfig for each cluster.
    // For now this only supports Gardener Shoot clusters.
    // The refresh runs asynchronously; use Cluster Inspect to check updated
    // credential timestamps (e.g., expiration_timestamp, kubeconfig_obtained_at).
    rpc RefreshClusters(ClusterDiscoveryConfigRefreshClustersRequest)
        returns (ClusterDiscoveryConfigRefreshClustersResponse) {
        option (google.api.http) = {
            post : "/v1/clusterdiscoveryconfig/{org_id}/{name}/refresh"
            body : "*"
        };
    }
}

message ClusterDiscoveryConfigCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    ClusterDiscoveryConfigInfo cluster_discovery_config_info = 2;
}

message ClusterDiscoveryConfigCreateResponse {
    ClusterDiscoveryConfigObject cluster_discovery_config = 1;
}

message ClusterDiscoveryConfigUpdateRequest {
    // Organization ID of the cluster discovery config to update.
    string org_id = 1;
    // Reference to the cluster discovery config to update (name is required, uid is optional for exact match).
    ObjectRef config_ref = 2;
    // Updated Gardener kubeconfig containing the token, certificate, and other
    // auth credentials for the Gardener API server. The server/API endpoint
    // within the kubeconfig cannot be changed via update.
    string gardener_kubeconfig = 3 [ (gogoproto.moretags) = "secure:\"true\"" ];
    // Toggle automatic discovery on or off.
    // Uses BoolValue wrapper to distinguish between "not provided" (nil) and "explicitly set to false".
    google.protobuf.BoolValue auto_discover = 4;
    // Updated frequency of automatic discovery when auto_discover is enabled.
    ClusterDiscoverySettings.AutoDiscoverFrequency auto_discover_frequency = 5;
    // Metadata labels to apply on the ClusterDiscoveryConfig object itself.
    // These are NOT the Shoot cluster label selectors used for discovery filtering
    // (see ShootDiscoveryConfigInfo.label_selector for that).
    map<string, string> metadata_labels = 6;
    // Confirmation flag required to proceed with the update.
    // Must be set to true explicitly; otherwise the update will be rejected.
    bool confirm_update = 7;
}

message ClusterDiscoveryConfigUpdateResponse {}

message ClusterDiscoveryConfigEnumerateRequest {
    string org_id = 1;
    // Filter by cluster discovery config type (optional). If not set, returns all types.
    ClusterDiscoveryConfigType type = 2;
    // Include sensitive fields like kubeconfigs in the response.
    bool include_secrets = 3;
    CommonEnumerateOptions options = 4;
}

message ClusterDiscoveryConfigEnumerateResponse {
    repeated ClusterDiscoveryConfigObject cluster_discovery_configs = 1;
    // total_count is the total number of cluster discovery configs.
    uint64 total_count = 2;
    // complete indicates if the result set is complete.
    bool complete = 3;
}

message ClusterDiscoveryConfigInspectRequest {
    string org_id = 1;
    // Name of the cluster discovery config to inspect.
    string name = 2;
    // Include sensitive fields like kubeconfigs in the response.
    bool include_secrets = 3;
    // uid of the cluster discovery config (optional).
    string uid = 4;
}

message ClusterDiscoveryConfigInspectResponse {
    ClusterDiscoveryConfigObject cluster_discovery_config = 1;
}

message ClusterDiscoveryConfigDeleteRequest {
    string org_id = 1;
    // Name of the cluster discovery config to delete.
    string name = 2;
    // uid of the cluster discovery config (optional).
    string uid = 3;
}

message ClusterDiscoveryConfigDeleteResponse {}

// Request to manually discover clusters for a specific cluster discovery config.
message ClusterDiscoveryConfigDiscoverClustersRequest {
    string org_id = 1;
    // Name of the ClusterDiscoveryConfig to discover clusters for.
    string name = 2;
    // UID of the ClusterDiscoveryConfig (optional but recommended for validation).
    string uid = 3;
}

// Response for manual cluster discovery.
message ClusterDiscoveryConfigDiscoverClustersResponse {
    // Indicates whether the discovery was successfully triggered.
    bool triggered = 1;
    // Message providing additional context (e.g., "Discovery started" or error details).
    string message = 2;
}

// Request to manually trigger an on-demand credential refresh for all clusters
// associated with a specific ClusterDiscoveryConfig.
// For Gardener Shoot clusters, this refreshes the kubeconfig using the Gardener API
// credentials stored in the discovery configuration.
message ClusterDiscoveryConfigRefreshClustersRequest {
    string org_id = 1;
    // Name of the ClusterDiscoveryConfig whose clusters need credential refresh.
    string name = 2;
    // UID of the ClusterDiscoveryConfig (optional but recommended for validation).
    string uid = 3;
}

// Response for manual cluster credential refresh.
message ClusterDiscoveryConfigRefreshClustersResponse {
    // Indicates whether the refresh was successfully triggered.
    bool triggered = 1;
    // Message providing additional context (e.g., "Refresh started" or error details).
    string message = 2;
}

// ============================================================================
// Resource-Centric Backup — PB-17448 happy-path subset.
//
// Design: workspace-config/specs/003-resource-centric-backup/
//         contracts/proto-changes-fc1.md
//
// SchedulePolicyInfo and BackupScheduleInfo are NOT touched. The SLA Policy and
// the Binding are new objects, so the legacy pair can go read-only at cutover
// without either message carrying two meanings.
// ============================================================================

// Five states. "Deleted" is the lifecycle field, never a sixth value.
enum ProtectionState {
    ProtectionStateInvalid = 0;
    // Discovered in the catalog; no placement applied yet.
    NotConfigured = 1;
    // Placement applied, so a destination is known; no Binding yet.
    Unprotected = 2;
    // Bound, but no recovery point qualifies yet.
    ProtectedNotInSLA = 3;
    // Bound and meeting its recoverability period.
    ProtectedInSLA = 4;
    // Carries an exclusion; outside the SLA denominator.
    Excluded = 5;
}

// The tier that owns an object. Full resolution is owned by PB-16926; the
// happy path always writes SuperAdmin.
enum OwnerTier {
    OwnerTierInvalid = 0;
    SuperAdmin = 1;
    InfraAdmin = 2;
    AppAdmin = 3;
    User = 4;
}

// Why a rule did or did not act on one resource.
//
// ONE vocabulary, shared by every preview and every Drift Event -- journeys C4,
// D5 and F11 each name an overlapping list, and three separate enums would drift
// apart. A free-form string cannot be switched on by a client, cannot be counted,
// and cannot be redacted per tier.
enum ClaimOutcome {
    ClaimOutcomeInvalid = 0;
    // The rule acted.
    Applied = 1;
    // Preview only: what would happen if this rule ran now.
    WouldPlace = 2;
    WouldBind = 3;
    WouldDelegate = 4;
    // Skipped. Claiming only ever ADDS -- an existing assignment, Binding or
    // delegation is never overwritten.
    SkippedAlreadyPlaced = 5;
    SkippedAlreadyBound = 6;
    SkippedAlreadyDelegated = 7;
    // Lost arbitration to a stronger tier, or to an equally ranked older rule.
    SkippedClaimedByOtherRule = 8;
    // Held out by an auto-rule exclusion.
    SkippedExcluded = 9;
    // Matched, but a Binding needs a placement first.
    FailedNoPlacement = 10;
    // Stopped matching. The assignment and Binding are RETAINED.
    DepartedScopeAssignmentRetained = 11;
}

// Which kind of rule produced an outcome.
enum RuleKind {
    RuleKindInvalid = 0;
    PlacementRuleKind = 1;
    BindingRuleKind = 2;
    DelegationRuleKind = 3;
}

// ---------------------------------------------------------------------------
// Shared leaf types for the resource-centric model.
//
// Each exists because no message in this API already carries its meaning.
// Metadata, Ownership and ObjectRef are reused rather than redefined.
// ---------------------------------------------------------------------------

// When a child belonged to a parent. Open-ended while it still belongs.
// Needed because Metadata's timestamps describe the OBJECT, not the relation,
// and a restore to a past time must know the membership at that time.
message MembershipInterval {
    // Kubernetes UID of the child, normally a VirtualMachine.
    string child_uid = 1;
    google.protobuf.Timestamp joined_time = 2;
    // Unset means the child is still a member.
    google.protobuf.Timestamp left_time = 3;
}

// Exactly one inventory owner per Kubernetes object -- FR-004.
// Without this a VM disk is captured twice: once by the namespace backup and
// once by the VM backup.
message GraphOwnerEntry {
    // For example "v1/ConfigMap" or "kubevirt.io/v1/VirtualMachine".
    string group_version_kind = 1;
    string object_name = 2;
    // The catalog resource that owns this object for inventory purposes.
    string owner_resource_uid = 3;
    // True when the object has several consumers and ownership was arbitrated.
    bool shared = 4;
}

// A volume with more than one consumer -- FR-010.
message SharedVolumeInfo {
    string pvc_name = 1;
    repeated string consumer_resource_uids = 2;
    // The consumer that owns it in the inventory. The others reference it.
    string owner_resource_uid = 3;
}

// Why a resource is held out of auto-rule claiming -- FR-014, FR-016.
// An exclusion needs a reason, an author and a time; no existing field holds
// any of these.
message AutoRuleExclusionInfo {
    bool excluded = 1;
    // A code from an ExclusionReasonTemplate.
    string reason_code = 2;
    string reason_text = 3;
    string excluded_by = 4;
    google.protobuf.Timestamp excluded_time = 5;
    // Unset means the exclusion does not expire.
    google.protobuf.Timestamp expires_time = 6;
    // The setter's tier, captured at the time.
    //
    // Needed to decide HOW FAR the exclusion reaches. An App Admin may set one
    // within their own resource scope, and a rule owned by a stronger tier may
    // or may not honour it. Without this field neither behaviour can be
    // expressed, because excluded_by is an identity whose tier can change.
    OwnerTier excluded_by_tier = 7;
}

// How one volume was actually captured, and why -- FR-098.
// BackupInfo.volumes records WHAT was backed up. This records which method
// moved it, and why a preferred method was not used.
message VolumeCaptureDetail {
    string pvc_name = 1;
    string namespace = 2;
    Method requested_method = 3;
    Method actual_method = 4;
    // Set only when actual_method differs from requested_method.
    string fallback_reason = 5;
    string volume_snapshot_class = 6;
    bool encrypted = 7;

    enum Method {
        MethodInvalid = 0;
        CSISnapshot = 1;
        PortworxCloudSnap = 2;
        GenericKDMP = 3;
        DirectKDMP = 4;
    }
}

// A per-intent destination override -- FR-036.
// One SLA Policy may hold intents that need different destinations, and a
// placement assignment carries only one backup_location_ref.
message IntentDestination {
    string intent_id = 1;
    ObjectRef backup_location_ref = 2;
    ObjectRef local_snapshot_ref = 3;
}

// One recorded change of owner -- FR-128.
// Ownership holds the current state only, with no history.
message OwnershipTransition {
    string from_owner = 1;
    string to_owner = 2;
    string changed_by = 3;
    google.protobuf.Timestamp changed_time = 4;
    string reason = 5;
}

// A count of resources in one protection state, for the summary views.
message ProtectionStateCount {
    ProtectionState state = 1;
    int32 count = 2;
    CatalogResourceInfo.Kind kind = 3;
}

// One derived schedule belonging to one Protection Intent.
//
// Groups the four values that BindingInfo already carries at 19 to 22 for the
// baseline. Those four are NOT reshaped into this message: that would be a
// breaking change for no gain.
message DerivedSchedule {
    string intent_id = 1;
    // DERIVED, never user-supplied. OUTPUT_ONLY.
    string schedule_key = 2;
    string schedule_policy_cr_name = 3;
    string backup_schedule_cr_name = 4;
    string backup_schedule_uid = 5;
}

// The requirement lives on the intent. Key material stays on the backup
// location, which is why there is no key reference here.
message EncryptionRequirement {
    bool require_customer_managed_key = 1;
}

// One statement of how often a resource is captured, how long it stays
// recoverable, and how it is captured.
//
// Embeddable only. It sits in an SLAPolicyInfo as a baseline intent and in a
// BindingInfo as a supplemental one, so it is never a standalone object.
//
// The four schedule forms are COPIED from SchedulePolicyInfo, keeping every
// field name, MINUS retain and incremental_count. Both of those appear in all
// five legacy forms and are duplicated at this level; retain is a count and
// would sit beside a period, giving one intent two retention models.
message ProtectionIntent {
    // Stable within its SLA Policy or its Binding.
    string intent_id = 1;

    oneof schedule {
        IntervalPolicy interval = 2;
        DailyPolicy daily = 3;
        WeeklyPolicy weekly = 4;
        MonthlyPolicy monthly = 5;
    }

    // Referenced rather than copied: a leaf value type with no retain conflict.
    // The wrapper is what separates "always full" (0) from unset, so it stays
    // a message.
    SchedulePolicyInfo.IncrementalCount incremental_count = 6;

    // Chosen by the administrator. Automatic run-time selection is out of v1.
    google.protobuf.Timestamp run_time = 7;

    // The ONLY retention field. A period, never a count. A count cannot say
    // "recoverable for 30 days" when runs are missed.
    google.protobuf.Duration recoverability_period = 8;

    // Capture. Relocated from BackupScheduleInfo.backup_type and .direct_kdmp.
    CaptureMode capture_mode = 9;
    // Super/Infra only. Fails rather than falling back to the generic path.
    bool require_snapshot_capture = 10;
    // Was BackupScheduleInfo.volume_snapshot_class_mapping.
    map<string, string> vsc_override_labels = 11;
    ObjectRef volume_resource_only_policy_ref = 12;
    EncryptionRequirement encryption_requirement = 13;

    Classification classification = 14;
    // Creator. Only the creator may edit a supplemental intent.
    string owner = 15;
    OwnerTier owner_tier = 16;

    // A floor the owner of the baseline sets -- FR-044. A supplemental intent
    // may not state a recoverability_period below it.
    google.protobuf.Duration minimum_retention_period = 17;

    // ---- the four forms, copied minus retain and incremental_count ----

    message IntervalPolicy {
        // Interval in minutes between runs.
        int64 minutes = 1;
    }

    message DailyPolicy {
        // time.Kitchen, for example 12:04PM.
        string time = 1;
    }

    message WeeklyPolicy {
        // Comma-separated days, for example sunday,monday.
        string day = 1;
        string time = 2;
        // Run on alternate weeks.
        bool bi_weekly = 3;
    }

    message MonthlyPolicy {
        // The deprecated flat fields on the legacy message are NOT copied.
        oneof monthly_policy {
            RelativeMonthlyPolicy relative_monthly_policy = 1;
            SelectiveMonthlyPolicy selective_monthly_policy = 2;
        }

        message SelectiveMonthlyPolicy {
            int64 date = 1;
            string time = 2;
            // Comma-separated months. Empty means every month.
            string months = 3;
        }

        message RelativeMonthlyPolicy {
            // One day only, for example sun.
            string day = 1;
            WeeklyIndex weekly_index = 2;
            string time = 3;

            enum WeeklyIndex {
                WeeklyIndexInvalid = 0;
                first = 1;
                second = 2;
                third = 3;
                fourth = 4;
                last = 5;
            }
        }
    }

    enum CaptureMode {
        CaptureModeInvalid = 0;
        // Prefers a snapshot; may fall back unless forbidden.
        AutomaticOptimized = 1;
        // Always the generic path; never silently switched.
        GenericCrossCloud = 2;
    }

    enum Classification {
        ClassificationInvalid = 0;
        // Came from the shared SLA Policy.
        Baseline = 1;
        // Lives in one Binding only.
        Supplemental = 2;
    }
}

// A reusable, resource-agnostic set of Protection Intents. Holds no location,
// no placement rule, no governance mode and no supplemental intent, so one SLA
// Policy can serve resources in different clusters.
//
// Metadata carries Ownership, so there is no owner field. There is no
// back-reference list of Bindings either: it would be unbounded at fleet scale
// and every bind would have to write this shared document. "Which Bindings use
// this SLA Policy" is an index on the Binding.
message SLAPolicyInfo {
    repeated ProtectionIntent protection_intents = 1;
    // Increases only. A recovery point records the revision it ran under.
    uint64 revision = 2;
    // Suppresses new scheduled runs. Not a resource state.
    bool paused = 3;
    // When it was suspended, and by whom. Needed to report the protection gap.
    google.protobuf.Timestamp paused_time = 4;
    string paused_by = 5;
    // OUTPUT_ONLY, computed from an index on the Binding. A COUNT, not a list:
    // a list would be unbounded at fleet scale and every bind would have to
    // write this shared document.
    int32 binding_count = 6;
}

message SLAPolicyObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    SLAPolicyInfo sla_policy_info = 2 [ (gogoproto.embed) = true ];
}

// One namespace or one virtual machine that we have discovered on a cluster.
//
// Nothing like this exists today. Note that ResourceInfo and ResourceObject are
// already taken and mean "what was inside a given backup", which is why this is
// named CatalogResource.
// Identity note: Metadata.uid holds the KUBERNETES UID and Metadata.name holds
// the namespace or virtual-machine name. They are not repeated here, both
// because the embed would collide and because it makes a catalog row
// addressable by the same --name and --uid pair as every other object.
// Identity is Metadata.uid plus cluster_ref; the name is display only, since a
// namespace can be deleted and recreated under the same name.
message CatalogResourceInfo {
    ObjectRef cluster_ref = 1;
    Kind kind = 2;
    // The namespace or virtual-machine name, for display and for naming the
    // stork objects. Not called "name", because Metadata already has one and
    // the embed would collide.
    string resource_name = 10;
    // Virtual machines only: the Kubernetes UID of the owning namespace.
    string parent_uid = 3;
    // An overlay on the state, not a sixth state.
    Lifecycle lifecycle = 4;
    // Materialized, never computed on read.
    ProtectionState protection_state = 5;

    google.protobuf.Timestamp first_seen_time = 6;
    google.protobuf.Timestamp deletion_time = 7;

    // At most one of each.
    ObjectRef placement_assignment_ref = 8;
    ObjectRef binding_ref = 9;

    // Namespaces only. Tells a list view that this namespace holds VMs, so the
    // UI can warn before a namespace-level action reaches a child.
    ContentBadge content_badge = 11;
    // Namespaces only. Materialized so a list view does not count children on
    // every read.
    int32 child_count = 12;
    int32 children_in_sla = 13;
    // VMs only. Which parent, for which interval. A restore to a past time
    // needs the membership AT that time, which parent_uid cannot give.
    repeated MembershipInterval membership_history = 14;
    // Exactly one inventory owner per Kubernetes object -- FR-004. This is what
    // stops a VM disk being captured by both the VM and its namespace.
    // Recomputed by discovery on every pass.
    repeated GraphOwnerEntry graph_owner_index = 15;
    // A volume with more than one consumer -- FR-010.
    repeated SharedVolumeInfo shared_volumes = 16;
    // Holds the resource out of auto-rule claiming -- FR-014.
    AutoRuleExclusionInfo exclusion = 17;
    // Discovery freshness. Separates "gone from the cluster" from "not scanned
    // in this pass"; first_seen_time covers only the first pass.
    google.protobuf.Timestamp last_seen_time = 18;

    enum ContentBadge {
        ContentBadgeInvalid = 0;
        ConventionalOnly = 1;
        VirtualMachinesOnly = 2;
        Mixed = 3;
    }

    enum Kind {
        KindInvalid = 0;
        AppNamespace = 1;
        VirtualMachine = 2;
    }

    enum Lifecycle {
        LifecycleInvalid = 0;
        Live = 1;
        Tombstoned = 2;
    }
}

message CatalogResourceObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    CatalogResourceInfo catalog_resource_info = 2 [ (gogoproto.embed) = true ];
}

// Which resources a rule targets. Shared by the placement rule and, later, the
// binding rule.
//
// Object-level label selectors are rejected at validation: they choose objects
// inside a namespace, which are not resources and cannot hold an assignment.
message ResourceFilter {
    // Empty means every cluster in the captured boundary.
    repeated ObjectRef cluster_refs = 1;
    // Must be stated explicitly; there is no implicit "everything".
    repeated CatalogResourceInfo.Kind target_kinds = 2;
    // A hand-picked set of catalog resource UIDs.
    repeated string resource_uids = 3;
    // Explicit namespace names, scoped by cluster_refs.
    repeated string namespaces = 4;
    // Select namespaces by the labels on the Namespace itself.
    map<string, string> namespace_label_selector = 5;
    // Select VMs by the labels on the VirtualMachine itself, independently of
    // the parent. Two maps rather than one, because a single selector could not
    // say "namespaces labelled tier=gold, and VMs labelled app=db", and
    // target_kinds names kinds rather than label sets.
    map<string, string> vm_label_selector = 6;
}

// A named statement of where the backups of matching resources go.
message PlacementRuleInfo {
    ResourceFilter filter = 1;
    // Mandatory, and always off-cluster.
    ObjectRef backup_location_ref = 2;
    // Optional local-snapshot leg. Local-only is invalid.
    ObjectRef local_snapshot_ref = 3;
    Mode mode = 4;
    // The creator's tier, captured at create time. Metadata.ownership already
    // carries who owns the rule, so there is no owner field here.
    OwnerTier owner_tier = 5;
    google.protobuf.Timestamp created_time = 6;
    // Auto rules only.
    bool enabled = 7;
    // One-shot rules: the moment of their single application.
    google.protobuf.Timestamp applied_time = 8;

    // OUTPUT_ONLY. When the auto cycle last evaluated this rule.
    google.protobuf.Timestamp last_evaluated_time = 9;
    // OUTPUT_ONLY. How many assignments this rule produced.
    int32 assignment_count = 10;
    // OUTPUT_ONLY. How many of them no longer match -- FR-030.
    int32 drift_count = 11;
    // The creator's authority at create time, frozen. Survives the creator
    // being removed -- FR-074. Reuses ResourceFilter rather than a new message.
    ResourceFilter captured_target_boundary = 12;

    enum Mode {
        ModeInvalid = 0;
        // Applies once, to whatever its filter matches at that moment.
        OneShot = 1;
        // Keeps applying to new matches.
        Auto = 2;
    }
}

message PlacementRuleObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    PlacementRuleInfo placement_rule_info = 2 [ (gogoproto.embed) = true ];
}

// One resource's resolved destination. Separate from the rule because it must
// keep the rule's definition as it was at apply time — otherwise editing an
// auto rule would retroactively move every resource already using it.
message PlacementAssignmentInfo {
    ObjectRef resource_ref = 1;
    ObjectRef backup_location_ref = 2;
    ObjectRef local_snapshot_ref = 3;
    google.protobuf.Timestamp applied_time = 4;
    // Frozen at apply time.
    ResourceFilter captured_rule_definition = 5;

    // Rule provenance.
    ObjectRef source_rule_ref = 6;
    bool still_matches_source_rule = 7;
    google.protobuf.Timestamp departed_since = 8;

    // Per-intent destination override -- FR-036. Empty means every intent uses
    // backup_location_ref.
    repeated IntentDestination intent_destinations = 9;
    // Records that the destination was reached by privilege elevation, and
    // under which context -- FR-118. Auditable after the fact; the delegate
    // never sees the location's credentials.
    string placement_inheriting_context = 10;
}

message PlacementAssignmentObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    PlacementAssignmentInfo placement_assignment_info = 2
        [ (gogoproto.embed) = true ];
}

// The durable junction of one resource and one SLA Policy.
//
// Reshaped from BackupScheduleInfo into a new object, keeping its field names
// where the meaning is unchanged. What was wrong with the legacy message is its
// cardinality: one schedule selects many namespaces. Here it is one to one, and
// selection moves out to the binding rule — that inversion is the whole model.
message BindingInfo {
    ObjectRef resource_ref = 1;
    // An SLAPolicyObject. NOT the legacy BackupScheduleInfo.schedule_policy_ref,
    // because it points at a different object.
    ObjectRef sla_policy_ref = 2;
    // Which revision was bound, for retention anchoring.
    uint64 sla_policy_revision = 3;
    string baseline_assignment_owner = 4;
    // DERIVED from the owner's tier, never selectable.
    Governance governance = 5;
    ObjectRef placement_assignment_ref = 6;
    // Stored inline. This is the only place a supplemental intent exists.
    repeated ProtectionIntent supplemental_intents = 7;

    // Binding-wide hooks. Reuses the existing RuleObject untouched.
    ObjectRef pre_exec_rule_ref = 8;
    ObjectRef post_exec_rule_ref = 9;

    BackupScheduleInfo.BackupObjectType backup_object_type = 10;
    repeated string resource_types = 11;
    bool parallel_backup = 12;
    bool keep_cr_status = 13;

    // Immutable.
    string created_by = 14;

    // Rule provenance, matching the placement assignment.
    ObjectRef source_rule_ref = 15;
    bool still_matches_source_rule = 16;
    google.protobuf.Timestamp departed_since = 17;

    // Field 18 held stork_schedule_refs, a list of CRs this Binding owned
    // under the one-schedule-per-resource model. A Binding no longer owns a
    // schedule; it contributes its resource to a shared one.
    reserved 18;
    reserved "stork_schedule_refs";

    // Which shared schedule executes this Binding.
    //
    // DERIVED, never user-supplied. Two Bindings holding the same value are
    // executed by one ApplicationBackupSchedule CR, so this is an
    // equivalence-class key rather than an identifier for anything.
    //
    // Readable rather than an opaque hash, because an operator has to be able
    // to see why two resources did not group:
    //     v1|c1|fb-bl|gold:daily|Namespace|hooks:none|par:false
    //
    // The leading version is load-bearing. Changing the derivation changes
    // every key and orphans every existing CR, so the prefix makes that
    // detectable rather than silent. The CR name is a short digest of this,
    // because Kubernetes needs a DNS-safe name under 63 characters.
    string schedule_key = 19;

    // The derived CR names, recorded so an unbind or a suspend can address
    // them without recomputing the digest.
    string schedule_policy_cr_name = 20;
    string backup_schedule_cr_name = 21;
    string backup_schedule_uid = 22;

    // Fields 19 to 22 describe the BASELINE intent's derived schedule only.
    // A Binding that carries supplemental intents contributes to more than one
    // schedule, so each extra one is recorded here. Suspend and Resume must
    // walk this list as well as the baseline -- FR-047.
    repeated DerivedSchedule additional_schedules = 23;

    // OUTPUT_ONLY. Materialized so a list view does not have to read every
    // recovery point to answer "when did this last run".
    google.protobuf.Timestamp last_run_time = 24;
    ObjectRef last_recovery_point_ref = 25;

    // Per-intent destination override, keyed by intent id -- FR-036.
    // NEVER returned to an App Admin -- FR-028.
    repeated IntentDestination intent_destinations = 26;
    // The hook definition in force, captured at execution start -- FR-065.
    uint64 hook_revision = 27;
    // Every ownership transfer, with reason -- FR-060, FR-096. Ownership holds
    // the current state only, so the history needs its own list.
    repeated OwnershipTransition owner_history = 28;
    // Reused from BackupScheduleInfo, same meaning.
    repeated string exclude_resource_types = 29;

    enum Governance {
        GovernanceInvalid = 0;
        // A Super or Infra Admin owns the baseline assignment.
        EnforcedBaseline = 1;
        // An App Admin owns it and may replace it.
        DelegatedControl = 2;
    }
}

message BindingObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    BindingInfo binding_info = 2 [ (gogoproto.embed) = true ];
}

// ---------------------------------------------------------------------------
// SLAPolicy service
// ---------------------------------------------------------------------------

message SLAPolicyCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    SLAPolicyInfo sla_policy = 2;
}
message SLAPolicyCreateResponse {}

message SLAPolicyInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message SLAPolicyInspectResponse { SLAPolicyObject sla_policy = 1; }

message SLAPolicyEnumerateRequest {
    string org_id = 1;
    map<string, string> labels = 2;
}
message SLAPolicyEnumerateResponse { repeated SLAPolicyObject sla_policies = 1; }

message SLAPolicyDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message SLAPolicyDeleteResponse {}

// One intent at a time, deliberately. A whole-object update could not tell
// "one intent added" from "three rewritten", and the impact review needs the
// exact change before it touches every Binding on this SLA Policy.
message SLAPolicyAddIntentRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    ProtectionIntent intent = 4;
}
message SLAPolicyAddIntentResponse {
    uint64 revision = 1;
    // Every Binding this addition reaches.
    repeated ObjectRef affected_bindings = 2;
}

// Suspend stops new scheduled runs for every Binding on this SLA policy. It
// removes nothing: the Bindings, the placements and every recovery point stay.
message SLAPolicySuspendRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message SLAPolicySuspendResponse {
    // The Bindings whose schedules were suspended.
    repeated ObjectRef suspended_bindings = 1;
}

message SLAPolicyResumeRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message SLAPolicyResumeResponse {
    repeated ObjectRef resumed_bindings = 1;
}

service SLAPolicy {
    // Create an SLA Policy with zero or more baseline intents.
    rpc Create(SLAPolicyCreateRequest) returns (SLAPolicyCreateResponse) {
        option (google.api.http) = {
            post : "/v1/slapolicy"
            body : "*"
        };
    }

    // Inspect returns one SLA Policy.
    rpc Inspect(SLAPolicyInspectRequest) returns (SLAPolicyInspectResponse) {
        option (google.api.http) = {
            get : "/v1/slapolicy/{org_id}/{name}/{uid}"
        };
    }

    // Enumerate returns every SLA Policy the caller may see.
    rpc Enumerate(SLAPolicyEnumerateRequest)
        returns (SLAPolicyEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/slapolicy/{org_id}"
        };
    }

    // Delete removes an SLA Policy. Refused while any Binding references it.
    rpc Delete(SLAPolicyDeleteRequest) returns (SLAPolicyDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/slapolicy/{org_id}/{name}/{uid}"
        };
    }

    // AddIntent adds one baseline intent and reports what it reaches.
    rpc AddIntent(SLAPolicyAddIntentRequest)
        returns (SLAPolicyAddIntentResponse) {
        option (google.api.http) = {
            post : "/v1/slapolicy/{org_id}/{name}/{uid}/intent"
            body : "*"
        };
    }

    // Suspend stops new scheduled runs across every Binding on this SLA policy.
    rpc Suspend(SLAPolicySuspendRequest) returns (SLAPolicySuspendResponse) {
        option (google.api.http) = {
            post : "/v1/slapolicy/{org_id}/{name}/{uid}/suspend"
            body : "*"
        };
    }

    // Resume lets the scheduled runs start again.
    //
    // Suspend and Resume MUST walk every derived schedule, baseline and
    // supplemental -- FR-047. Addressing the baseline key alone leaves a
    // supplemental schedule running through a suspend, and reports success.
    rpc Resume(SLAPolicyResumeRequest) returns (SLAPolicyResumeResponse) {
        option (google.api.http) = {
            post : "/v1/slapolicy/{org_id}/{name}/{uid}/resume"
            body : "*"
        };
    }

    // Update replaces the intent list wholesale. It refuses to touch an intent
    // whose classification is Supplemental, because those live on a Binding.
    // It bumps revision and re-derives the schedule key of every Binding on
    // this policy.
    rpc Update(SLAPolicyUpdateRequest) returns (SLAPolicyUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/slapolicy"
            body : "*"
        };
    }

    // UpdateIntent edits ONE intent in place, so a client does not have to
    // send the whole list and risk dropping a concurrent editor's change.
    rpc UpdateIntent(SLAPolicyUpdateIntentRequest)
        returns (SLAPolicyUpdateIntentResponse) {
        option (google.api.http) = {
            put : "/v1/slapolicy/{org_id}/{name}/{uid}/intent/{intent_id}"
            body : "*"
        };
    }

    // RemoveIntent is the pair of AddIntent. Without it an intent can only be
    // removed by a whole-list Update.
    rpc RemoveIntent(SLAPolicyRemoveIntentRequest)
        returns (SLAPolicyRemoveIntentResponse) {
        option (google.api.http) = {
            delete : "/v1/slapolicy/{org_id}/{name}/{uid}/intent/{intent_id}"
        };
    }

    // Journey B13. Read-only translated mechanics for a reusable SLA Policy:
    // what the plain-language intents mean as schedules, copies and capture.
    rpc PreviewMechanics(SLAPolicyPreviewMechanicsRequest)
        returns (SLAPolicyPreviewMechanicsResponse) {
        option (google.api.http) = {
            get : "/v1/slapolicy/{org_id}/{name}/{uid}/mechanics"
        };
    }

    rpc UpdateOwnership(SLAPolicyUpdateOwnershipRequest)
        returns (SLAPolicyUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/slapolicy/updateownership/{org_id}/{name}/{uid}"
            body : "*"
        };
    }
}

message SLAPolicyUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    SLAPolicyInfo sla_policy = 2;
}
message SLAPolicyUpdateResponse {
    SLAPolicyObject sla_policy = 1;
    // How many Bindings had their schedule key re-derived.
    int32 regrouped_binding_count = 2;
}

message SLAPolicyUpdateIntentRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    string intent_id = 4;
    ProtectionIntent intent = 5;
}
message SLAPolicyUpdateIntentResponse {
    SLAPolicyObject sla_policy = 1;
    int32 regrouped_binding_count = 2;
}

message SLAPolicyRemoveIntentRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    string intent_id = 4;
}
message SLAPolicyRemoveIntentResponse {
    SLAPolicyObject sla_policy = 1;
    // Resources that lose coverage when this intent goes. Returned so the
    // caller can review the blast radius.
    repeated ObjectRef affected_resources = 2;
}

message SLAPolicyUpdateOwnershipRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    repeated Ownership.AccessConfig users = 4;
    repeated Ownership.AccessConfig groups = 5;
    repeated string remove_users = 6;
    repeated string remove_groups = 7;
}
message SLAPolicyUpdateOwnershipResponse {
    SLAPolicyObject sla_policy = 1;
}

// ---------------------------------------------------------------------------
// ResourceCatalog service — read-only. The catalog is written by discovery.
// ---------------------------------------------------------------------------

message ResourceCatalogEnumerateRequest {
    string org_id = 1;
    // Empty means every cluster.
    string cluster_name = 2;
    string cluster_uid = 3;
    // Empty means every kind.
    repeated CatalogResourceInfo.Kind kinds = 4;
    // Empty means every state.
    repeated ProtectionState states = 5;
    // Tombstoned rows are hidden unless this is set.
    bool include_tombstoned = 6;
}
message ResourceCatalogEnumerateResponse {
    repeated CatalogResourceObject resources = 1;
    // Per-state totals, so a caller need not count client-side.
    map<string, uint64> state_counts = 2;
}

message ResourceCatalogInspectRequest {
    string org_id = 1;
    // The Kubernetes UID, which is the identity.
    string uid = 2;
}
message ResourceCatalogInspectResponse { CatalogResourceObject resource = 1; }

service ResourceCatalog {
    // Enumerate lists discovered namespaces and virtual machines.
    rpc Enumerate(ResourceCatalogEnumerateRequest)
        returns (ResourceCatalogEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/catalogresource/{org_id}"
        };
    }

    // Inspect returns one catalog resource by its Kubernetes UID.
    rpc Inspect(ResourceCatalogInspectRequest)
        returns (ResourceCatalogInspectResponse) {
        option (google.api.http) = {
            get : "/v1/catalogresource/{org_id}/{uid}"
        };
    }

    // UpdateOwnership grants or revokes another identity's access to a
    // resource. Named for the house standard; no other service in this API
    // calls this operation "UpdateShare". Merge semantics are unchanged.
    rpc UpdateOwnership(ResourceCatalogUpdateOwnershipRequest)
        returns (ResourceCatalogUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/catalogresource/updateownership/{org_id}/{uid}"
            body : "*"
        };
    }

    // Update is the ONLY mutable part of a catalog row. Everything else is
    // written by discovery, so there is no Create and no Delete here: a client
    // cannot invent a namespace.
    rpc Update(ResourceCatalogUpdateRequest)
        returns (ResourceCatalogUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/catalogresource/{org_id}/{uid}"
            body : "*"
        };
    }

    // Preview resolves a ResourceFilter and returns what it WOULD select,
    // without writing anything -- FR-011. Required before a rule is created,
    // because scope is applied by intersection and two callers writing the
    // same filter legitimately see different sets -- FR-074a.
    rpc Preview(ResourceCatalogPreviewRequest)
        returns (ResourceCatalogPreviewResponse) {
        option (google.api.http) = {
            post : "/v1/catalogresource/preview/{org_id}"
            body : "*"
        };
    }

    // Journey M2. The ONE case where a client creates a catalog row: the
    // source cluster is gone, so discovery can never produce it, and without
    // a row its recovery points cannot be reached.
    rpc Reconstruct(ResourceCatalogReconstructRequest)
        returns (ResourceCatalogReconstructResponse) {
        option (google.api.http) = {
            post : "/v1/catalogresource/reconstruct/{org_id}"
            body : "*"
        };
    }
}

message ResourceCatalogUpdateRequest {
    string org_id = 1;
    // The catalog resource's Kubernetes UID.
    string uid = 2;
    // Infra or higher. Clearing it means setting excluded to false.
    AutoRuleExclusionInfo exclusion = 3;
}
message ResourceCatalogUpdateResponse {
    CatalogResourceObject resource = 1;
}

message ResourceCatalogPreviewRequest {
    string org_id = 1;
    ResourceFilter filter = 2;
}
message ResourceCatalogPreviewResponse {
    // What the filter selects for THIS caller, after their scope is applied.
    repeated CatalogResourceObject matched = 1;
    int32 matched_count = 2;
    // Resources the filter matched but that cannot be claimed, with a reason
    // such as "Claimed by <rule>" or "Excluded".
    repeated SkippedResource skipped = 3;

    message SkippedResource {
        string resource_uid = 1;
        string resource_name = 2;
        // Free text for a human. Prefer `outcome` for any decision.
        string reason = 3;
        ClaimOutcome outcome = 4;
        // The rule that won, when outcome is SkippedClaimedByOtherRule.
        //
        // REDACTED for a caller whose tier is below the winning rule's owner:
        // naming it would reveal a stronger tier's rule to someone who may not
        // see it. The outcome still says the resource was claimed.
        ObjectRef winning_rule_ref = 5;
    }
}

// Sharing a resource is how a persona boundary is crossed. An Infra or Super
// Admin owns the inventory; an App Admin sees a namespace only once it has been
// shared with them.
//
// Read lets the grantee see the resource, its Bindings and what it can restore.
// Write additionally lets them add a supplemental intent and edit hooks. Neither
// lets them rebind, unbind, weaken the baseline, or see a destination: those are
// refused by tier, not by the access level.
//
// Sharing carries through the read path. A grantee who can see a resource can
// see that resource's Bindings, recovery points and backups, because a share
// that showed the resource but not its history would be useless.
message ResourceCatalogUpdateOwnershipRequest {
    string org_id = 1;
    // The catalog resource's Kubernetes UID.
    string uid = 2;
    // Identities to grant. Replaces the current grant list for the ids named.
    repeated Ownership.AccessConfig users = 3;
    repeated Ownership.AccessConfig groups = 4;
    // Identities to revoke, by id. Applied after the grants above.
    repeated string remove_users = 5;
    repeated string remove_groups = 6;

    // Set an auto-rule exclusion in the SAME call as the ownership change.
    //
    // A resource handed over deliberately unprotected, so the delegate can
    // author and own its protection, is indistinguishable from any other
    // unbound resource. The next auto Binding Rule cycle would claim it and
    // produce an enforced baseline the delegate cannot replace. Marking it
    // here closes that window atomically.
    AutoRuleExclusionInfo set_exclusion = 7;
}
message ResourceCatalogUpdateOwnershipResponse {
    CatalogResourceObject resource = 1;
}

// ---------------------------------------------------------------------------
// PlacementRule service
// ---------------------------------------------------------------------------

message PlacementRuleCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    PlacementRuleInfo placement_rule = 2;
}
message PlacementRuleCreateResponse {}

message PlacementRuleInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message PlacementRuleInspectResponse { PlacementRuleObject placement_rule = 1; }

message PlacementRuleEnumerateRequest {
    string org_id = 1;
    map<string, string> labels = 2;
}
message PlacementRuleEnumerateResponse {
    repeated PlacementRuleObject placement_rules = 1;
}

message PlacementRuleDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message PlacementRuleDeleteResponse {}

service PlacementRule {
    rpc Create(PlacementRuleCreateRequest)
        returns (PlacementRuleCreateResponse) {
        option (google.api.http) = {
            post : "/v1/placementrule"
            body : "*"
        };
    }

    rpc Inspect(PlacementRuleInspectRequest)
        returns (PlacementRuleInspectResponse) {
        option (google.api.http) = {
            get : "/v1/placementrule/{org_id}/{name}/{uid}"
        };
    }

    rpc Enumerate(PlacementRuleEnumerateRequest)
        returns (PlacementRuleEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/placementrule/{org_id}"
        };
    }

    // Delete is refused while any assignment still references the rule.
    rpc Delete(PlacementRuleDeleteRequest)
        returns (PlacementRuleDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/placementrule/{org_id}/{name}/{uid}"
        };
    }

    // Update edits the rule. It does NOT touch assignments already made --
    // FR-030 -- so it returns the resulting drift count rather than moving
    // anything. A one-shot rule is immutable after its single application.
    rpc Update(PlacementRuleUpdateRequest)
        returns (PlacementRuleUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/placementrule"
            body : "*"
        };
    }

    // UpdateOwnership shares the RULE itself, not the resources it matches.
    rpc UpdateOwnership(PlacementRuleUpdateOwnershipRequest)
        returns (PlacementRuleUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/placementrule/updateownership/{org_id}/{name}/{uid}"
            body : "*"
        };
    }

    // Apply runs a one-shot rule now, or forces an auto rule's cycle.
    // Claiming only ever ADDS protection: a resource already claimed by
    // another rule is skipped, never taken -- FR-075.
    rpc Apply(PlacementRuleApplyRequest)
        returns (PlacementRuleApplyResponse) {
        option (google.api.http) = {
            post : "/v1/placementrule/apply/{org_id}/{name}/{uid}"
            body : "*"
        };
    }
}

message PlacementRuleUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    PlacementRuleInfo placement_rule = 2;
}
message PlacementRuleUpdateResponse {
    PlacementRuleObject placement_rule = 1;
    // Assignments that no longer match the edited rule. They are NOT moved.
    int32 drift_count = 2;
}

message PlacementRuleUpdateOwnershipRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    repeated Ownership.AccessConfig users = 4;
    repeated Ownership.AccessConfig groups = 5;
    repeated string remove_users = 6;
    repeated string remove_groups = 7;
}
message PlacementRuleUpdateOwnershipResponse {
    PlacementRuleObject placement_rule = 1;
}

message PlacementRuleApplyRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    // Resolve and report without writing. Same result shape as a real apply.
    bool dry_run = 4;
}
message PlacementRuleApplyResponse {
    int32 claimed_count = 1;
    repeated ResourceCatalogPreviewResponse.SkippedResource skipped = 2;
}

// ---------------------------------------------------------------------------
// PlacementAssignment service
// ---------------------------------------------------------------------------

// Create applies a placement rule. It names the RULE, never a resource: the
// rule carries the filter and the filter chooses the resources. One call
// therefore writes many assignments.
message PlacementAssignmentCreateRequest {
    string org_id = 1;
    string placement_rule_name = 2;
    string placement_rule_uid = 3;
    // Narrows what the filter already matched, for a staged rollout. A UID the
    // filter does not match is rejected rather than applied.
    repeated string only_catalog_resource_uids = 4;
    // Report what would happen and write nothing.
    bool dry_run = 5;
}
message PlacementAssignmentCreateResponse {
    repeated ObjectRef applied = 1;
    repeated ObjectRef skipped_already_assigned = 2;
    repeated string rejected_not_matching_filter = 3;
}

message PlacementAssignmentInspectRequest {
    string org_id = 1;
    // The catalog resource UID. An assignment is one-to-one with a resource.
    string catalog_resource_uid = 2;
}
message PlacementAssignmentInspectResponse {
    PlacementAssignmentObject placement_assignment = 1;
}

message PlacementAssignmentEnumerateRequest {
    string org_id = 1;
    string placement_rule_name = 2;
    string placement_rule_uid = 3;
}
message PlacementAssignmentEnumerateResponse {
    repeated PlacementAssignmentObject placement_assignments = 1;
}

// Clear requires the resource to be unbound first.
message PlacementAssignmentDeleteRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
}
message PlacementAssignmentDeleteResponse {}

message PlacementAssignmentUpdateRequest {
    string org_id = 1;
    // Identified by the resource it belongs to, not by its own name.
    string catalog_resource_uid = 2;
    // Set to re-read the source rule and adopt its current definition. This
    // is the ONLY way an edited rule reaches a resource already assigned.
    bool refresh_from_rule = 3;
    // Ignored when refresh_from_rule is set.
    ObjectRef backup_location_ref = 4;
    ObjectRef local_snapshot_ref = 5;
    repeated IntentDestination intent_destinations = 6;
}
message PlacementAssignmentUpdateResponse {
    PlacementAssignmentObject placement_assignment = 1;
}

service PlacementAssignment {
    // Create applies a placement rule to every resource its filter matches.
    rpc Create(PlacementAssignmentCreateRequest)
        returns (PlacementAssignmentCreateResponse) {
        option (google.api.http) = {
            post : "/v1/placementassignment"
            body : "*"
        };
    }

    rpc Inspect(PlacementAssignmentInspectRequest)
        returns (PlacementAssignmentInspectResponse) {
        option (google.api.http) = {
            get : "/v1/placementassignment/{org_id}/{catalog_resource_uid}"
        };
    }

    rpc Enumerate(PlacementAssignmentEnumerateRequest)
        returns (PlacementAssignmentEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/placementassignment/{org_id}"
        };
    }

    // Update changes the destination for one resource.
    //
    // There is deliberately no UpdateOwnership on this service. An assignment
    // is not independently owned: its owner is the Placement Rule's owner and
    // its visibility comes from the catalog row it names. A third settable
    // owner would let a destination be read by someone who can read neither.
    rpc Update(PlacementAssignmentUpdateRequest)
        returns (PlacementAssignmentUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/placementassignment/{org_id}/{catalog_resource_uid}"
            body : "*"
        };
    }

    rpc Delete(PlacementAssignmentDeleteRequest)
        returns (PlacementAssignmentDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/placementassignment/{org_id}/{catalog_resource_uid}"
        };
    }
}

// One resource's entry in one run of a shared backup.
//
// A backup now covers many resources, so the backup alone cannot answer "what
// can I restore for this namespace". This can NOT be derived by querying
// stork's per-namespace array inside the backup document, because that array
// is keyed by namespace NAME while identity here is the Kubernetes UID. A
// namespace deleted and recreated under the same name is a different resource,
// and a name-keyed lookup would hand it the earlier resource's history.
//
// A recovery point exists only for a resource that actually succeeded. A
// resource that failed inside a partially successful backup gets none, so its
// timeline shows a gap and the SLA engine reports it out of SLA. That is how
// per-resource failure isolation survives a shared execution.
message RecoveryPointInfo {
    // Identified by Kubernetes UID, never by name.
    ObjectRef resource_ref = 1;
    // The SHARED backup this came from. Several recovery points point here.
    ObjectRef backup_ref = 2;
    string intent_id = 3;
    Status status = 4;
    // False when the resource's own data did not complete, even if the
    // backup as a whole reports partial success.
    bool restorable = 5;
    uint64 size_bytes = 6;
    // Retention is anchored to the revision in force at capture.
    uint64 sla_policy_revision_at_capture = 7;
    google.protobuf.Timestamp taken_time = 8;
    // Drives reference-counted deletion: the shared backup may only be removed
    // once the last recovery point referencing it is gone.
    google.protobuf.Timestamp expiry_time = 9;
    // Populated when the resource did not succeed, for the timeline gap.
    string failure_reason = 10;

    // OUTPUT_ONLY, computed per caller and never stored. Separates "this point
    // exists but is not yours" from "this point does not exist" -- FR-105.
    // It gates the per-resource view of a backup shared by several tenants.
    bool accessible = 11;
    // Which Binding produced it. intent_id alone does not say, because two
    // Bindings may carry the same intent id.
    ObjectRef binding_ref = 12;
    // A VM's point refers to its namespace's point from the same run, when one
    // exists. A VM point may publish where the parent point failed.
    ObjectRef parent_recovery_point_ref = 13;

    enum Status {
        StatusInvalid = 0;
        Successful = 1;
        PartialSuccess = 2;
    }
}

message RecoveryPointObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    RecoveryPointInfo recovery_point_info = 2 [ (gogoproto.embed) = true ];
}

message RecoveryPointEnumerateRequest {
    string org_id = 1;
    // The catalog resource UID. Empty returns every recovery point in the org.
    string catalog_resource_uid = 2;
    string intent_id = 3;
    // Only points that can actually be restored.
    bool restorable_only = 4;
}
message RecoveryPointEnumerateResponse {
    repeated RecoveryPointObject recovery_points = 1;
}

message RecoveryPointInspectRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    // The shared backup this point belongs to.
    string backup_name = 3;
    string backup_uid = 4;
}
message RecoveryPointInspectResponse { RecoveryPointObject recovery_point = 1; }

service RecoveryPoint {
    // Enumerate returns one resource's timeline, newest first.
    rpc Enumerate(RecoveryPointEnumerateRequest)
        returns (RecoveryPointEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/recoverypoint/{org_id}"
        };
    }

    // Inspect returns one resource's entry in one backup.
    rpc Inspect(RecoveryPointInspectRequest)
        returns (RecoveryPointInspectResponse) {
        option (google.api.http) = {
            get : "/v1/recoverypoint/{org_id}/{catalog_resource_uid}/{backup_name}"
        };
    }

    // Timeline returns the points for one resource in time order WITH THE GAPS
    // NAMED -- FR-108. A timeline that shows only successes is misleading: a
    // missing run is what puts a resource out of SLA.
    rpc Timeline(RecoveryPointTimelineRequest)
        returns (RecoveryPointTimelineResponse) {
        option (google.api.http) = {
            get : "/v1/recoverypoint/timeline/{org_id}/{catalog_resource_uid}"
        };
    }

    // EnumerateForRestore returns only the points that are both restorable and
    // accessible to the caller, for one resource at one target time.
    rpc EnumerateForRestore(RecoveryPointEnumerateForRestoreRequest)
        returns (RecoveryPointEnumerateForRestoreResponse) {
        option (google.api.http) = {
            get : "/v1/recoverypoint/forrestore/{org_id}/{catalog_resource_uid}"
        };
    }

    // Delete is for retention only, and is refused until expiry_time is
    // written. The shared backup is reference-counted: it may be removed only
    // when the LAST recovery point naming it is gone.
    rpc Delete(RecoveryPointDeleteRequest)
        returns (RecoveryPointDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/recoverypoint/{org_id}/{catalog_resource_uid}/{backup_name}"
        };
    }
}

message RecoveryPointTimelineRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    google.protobuf.Timestamp from_time = 3;
    google.protobuf.Timestamp to_time = 4;
    // Empty means every intent.
    repeated string intent_ids = 5;
}
message RecoveryPointTimelineResponse {
    repeated RecoveryPointObject recovery_points = 1;
    // A run that was expected and did not produce a point. As important as a
    // point, and the reason a resource falls out of SLA.
    repeated Gap gaps = 2;

    message Gap {
        string intent_id = 1;
        google.protobuf.Timestamp expected_time = 2;
        string reason = 3;
    }
}

message RecoveryPointEnumerateForRestoreRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    // The newest point at or before this time. Unset means the newest point.
    google.protobuf.Timestamp target_time = 3;
}
message RecoveryPointEnumerateForRestoreResponse {
    repeated RecoveryPointObject recovery_points = 1;
    // VMs that belonged to this namespace AT target_time -- FR-008, FR-110.
    // Present membership is the wrong answer for a past restore.
    repeated string member_resource_uids_at_target_time = 2;
}

message RecoveryPointDeleteRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    string backup_name = 3;
}
message RecoveryPointDeleteResponse {
    // True when this was the last point naming the shared backup, so the
    // backup itself became eligible for deletion.
    bool backup_released = 1;
    // How many points still reference that backup.
    int32 remaining_reference_count = 2;
}

// ---------------------------------------------------------------------------
// Binding service
// ---------------------------------------------------------------------------

// Create is create-if-absent. It fails when the resource has no placement,
// because then there is nowhere to send the backups, and there is no override
// for any tier.
message BindingCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // One or more catalog resource UIDs. Each gets its own Binding.
    repeated string catalog_resource_uids = 2;
    string sla_policy_name = 3;
    string sla_policy_uid = 4;
    ObjectRef pre_exec_rule_ref = 5;
    ObjectRef post_exec_rule_ref = 6;
    BackupScheduleInfo.BackupObjectType backup_object_type = 7;
}
message BindingCreateResponse {
    repeated ObjectRef created = 1;
    repeated ObjectRef skipped_already_bound = 2;
    repeated string rejected_no_placement = 3;
}

message BindingInspectRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
}
message BindingInspectResponse { BindingObject binding = 1; }

message BindingEnumerateRequest {
    string org_id = 1;
    string sla_policy_name = 2;
    string sla_policy_uid = 3;
}
message BindingEnumerateResponse { repeated BindingObject bindings = 1; }

// Delete is the unbind. It retains the placement and every historical
// recovery point.
message BindingDeleteRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
}
message BindingDeleteResponse {}

// A supplemental intent is Binding-local (FR-063). It extends the one Binding
// it is added to, and creates no second SLA Policy and no second Binding.
//
// This is why it cannot go on the SLA Policy instead: a policy is shared, so an
// intent placed there fans out to every resource bound to it. An App Admin
// given one namespace would then impose their chosen cadence, and its cost, on
// resources they were never given.
message BindingAddSupplementalIntentRequest {
    string org_id = 1;
    // The resource whose Binding gains the intent.
    string catalog_resource_uid = 2;
    // The intent to add. Its owner, tier and classification are stamped by the
    // server from the caller's token and cannot be set by the request.
    ProtectionIntent intent = 3;
}
message BindingAddSupplementalIntentResponse {
    // The schedule this intent will execute on. It is a new shared schedule
    // whenever no existing one carries the same schedule key.
    string backup_schedule_cr_name = 1;
    // How many intents the Binding now carries, baseline included.
    int64 intent_count = 2;
}

service Binding {
    rpc Create(BindingCreateRequest) returns (BindingCreateResponse) {
        option (google.api.http) = {
            post : "/v1/binding"
            body : "*"
        };
    }

    rpc Inspect(BindingInspectRequest) returns (BindingInspectResponse) {
        option (google.api.http) = {
            get : "/v1/binding/{org_id}/{catalog_resource_uid}"
        };
    }

    rpc Enumerate(BindingEnumerateRequest) returns (BindingEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/binding/{org_id}"
        };
    }

    // AddSupplementalIntent extends ONE Binding without touching the SLA
    // Policy that governs it.
    rpc AddSupplementalIntent(BindingAddSupplementalIntentRequest)
        returns (BindingAddSupplementalIntentResponse) {
        option (google.api.http) = {
            put : "/v1/binding/supplementalintent/{org_id}/{catalog_resource_uid}"
            body : "*"
        };
    }

    rpc Delete(BindingDeleteRequest) returns (BindingDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/binding/{org_id}/{catalog_resource_uid}"
        };
    }

    // Update replaces the supplemental list and the capture settings.
    // Requires Write on the RESOURCE, not on the SLA Policy.
    rpc Update(BindingUpdateRequest) returns (BindingUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/binding/{org_id}/{catalog_resource_uid}"
            body : "*"
        };
    }

    // RemoveSupplementalIntent is the pair of AddSupplementalIntent.
    rpc RemoveSupplementalIntent(BindingRemoveSupplementalIntentRequest)
        returns (BindingRemoveSupplementalIntentResponse) {
        option (google.api.http) = {
            delete : "/v1/binding/supplementalintent/{org_id}/{catalog_resource_uid}/{intent_id}"
        };
    }

    // TriggerNow runs one intent immediately, against this Binding's own
    // destination and capture settings -- FR-060.
    rpc TriggerNow(BindingTriggerNowRequest)
        returns (BindingTriggerNowResponse) {
        option (google.api.http) = {
            post : "/v1/binding/triggernow/{org_id}/{catalog_resource_uid}"
            body : "*"
        };
    }

    // PreviewSchedule returns the next N run times across every intent --
    // FR-061. A recoverability period hides a copy count, and this is how a
    // client shows the real cadence before committing.
    rpc PreviewSchedule(BindingPreviewScheduleRequest)
        returns (BindingPreviewScheduleResponse) {
        option (google.api.http) = {
            get : "/v1/binding/previewschedule/{org_id}/{catalog_resource_uid}"
        };
    }

    rpc UpdateOwnership(BindingUpdateOwnershipRequest)
        returns (BindingUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/binding/updateownership/{org_id}/{catalog_resource_uid}"
            body : "*"
        };
    }
}

message BindingUpdateRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    // Replaces the list wholesale. Only the creator of an intent may change
    // it -- FR-064.
    repeated ProtectionIntent supplemental_intents = 3;
    ObjectRef pre_exec_rule_ref = 4;
    ObjectRef post_exec_rule_ref = 5;
    BackupScheduleInfo.BackupObjectType backup_object_type = 6;
    repeated string resource_types = 7;
    repeated string exclude_resource_types = 8;
    bool parallel_backup = 9;
    bool keep_cr_status = 10;
    // Super and Infra only. Never accepted from an App Admin -- FR-028.
    repeated IntentDestination intent_destinations = 11;
}
message BindingUpdateResponse {
    BindingObject binding = 1;
}

message BindingRemoveSupplementalIntentRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    string intent_id = 3;
}
message BindingRemoveSupplementalIntentResponse {
    BindingObject binding = 1;
}

message BindingTriggerNowRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    // Which intent to run. Required: a Binding may carry several.
    string intent_id = 3;
}
message BindingTriggerNowResponse {
    // The backup this run produced, once it has been created.
    ObjectRef backup_ref = 1;
}

message BindingPreviewScheduleRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    // How many future run times to return per intent. Default 10.
    int32 count = 3;
}
message BindingPreviewScheduleResponse {
    repeated IntentSchedule schedules = 1;

    message IntentSchedule {
        string intent_id = 1;
        string schedule_key = 2;
        repeated google.protobuf.Timestamp next_run_times = 3;
        // The count derived from the recoverability period:
        // ceil(period / longest gap), floored at 1. Shown because a user
        // states a business need and does not do this arithmetic.
        int32 derived_retain_count = 4;
    }
}

message BindingUpdateOwnershipRequest {
    string org_id = 1;
    string catalog_resource_uid = 2;
    repeated Ownership.AccessConfig users = 3;
    repeated Ownership.AccessConfig groups = 4;
    repeated string remove_users = 5;
    repeated string remove_groups = 6;
}
message BindingUpdateOwnershipResponse {
    BindingObject binding = 1;
}

// ---------------------------------------------------------------------------
// BindingRule service
//
// The Placement Rule answers "where". This answers "under which SLA Policy".
// Nothing in this API carried that meaning before, so the whole object and
// service are new -- FR-052, FR-072, FR-080.
//
// Auto Placement Rules evaluate BEFORE auto Binding Rules on every cycle --
// FR-072. A resource cannot be bound before it has a destination.
// ---------------------------------------------------------------------------

message BindingRuleInfo {
    // The same message the Placement Rule uses. Object-level label selectors
    // are rejected at validation with a typed error, never ignored: those
    // objects are not resources and cannot hold a Binding.
    ResourceFilter filter = 1;
    // Must be owned by this rule's owner -- FR-055.
    ObjectRef sla_policy_ref = 2;
    // Reuses the Placement Rule's enum rather than declaring a second one.
    PlacementRuleInfo.Mode mode = 3;
    OwnerTier owner_tier = 4;
    google.protobuf.Timestamp created_time = 5;
    bool enabled = 6;
    google.protobuf.Timestamp applied_time = 7;

    // Binding-wide capture settings, stamped onto every Binding it creates.
    ObjectRef pre_exec_rule_ref = 8;
    ObjectRef post_exec_rule_ref = 9;
    BackupScheduleInfo.BackupObjectType backup_object_type = 10;
    repeated string resource_types = 11;
    bool parallel_backup = 12;
    bool keep_cr_status = 13;

    // OUTPUT_ONLY.
    google.protobuf.Timestamp last_evaluated_time = 14;
    int32 binding_count = 15;
    int32 drift_count = 16;

    // The creator's authority at create time, frozen -- FR-074.
    ResourceFilter captured_target_boundary = 17;
    // Super and Infra only. Per-intent destination override -- FR-036.
    repeated IntentDestination intent_destination_template = 18;
    // Super and Infra only.
    map<string, string> vsc_override_template = 19;
}

message BindingRuleObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    BindingRuleInfo binding_rule_info = 2 [ (gogoproto.embed) = true ];
}

message BindingRuleCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    BindingRuleInfo binding_rule = 2;
}
message BindingRuleCreateResponse { BindingRuleObject binding_rule = 1; }

message BindingRuleInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message BindingRuleInspectResponse { BindingRuleObject binding_rule = 1; }

message BindingRuleEnumerateRequest {
    string org_id = 1;
    // Empty means every mode.
    repeated PlacementRuleInfo.Mode modes = 2;
}
message BindingRuleEnumerateResponse {
    repeated BindingRuleObject binding_rules = 1;
}

message BindingRuleUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    BindingRuleInfo binding_rule = 2;
}
message BindingRuleUpdateResponse {
    BindingRuleObject binding_rule = 1;
    int32 drift_count = 2;
}

message BindingRuleDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message BindingRuleDeleteResponse {}

message BindingRuleApplyRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    bool dry_run = 4;
}
message BindingRuleApplyResponse {
    int32 bound_count = 1;
    repeated ResourceCatalogPreviewResponse.SkippedResource skipped = 2;
}

message BindingRuleUpdateOwnershipRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    repeated Ownership.AccessConfig users = 4;
    repeated Ownership.AccessConfig groups = 5;
    repeated string remove_users = 6;
    repeated string remove_groups = 7;
}
message BindingRuleUpdateOwnershipResponse {
    BindingRuleObject binding_rule = 1;
}

// The shape follows PlacementRule exactly, so an operator learns one pattern.
service BindingRule {
    rpc Create(BindingRuleCreateRequest)
        returns (BindingRuleCreateResponse) {
        option (google.api.http) = {
            post : "/v1/bindingrule"
            body : "*"
        };
    }

    rpc Inspect(BindingRuleInspectRequest)
        returns (BindingRuleInspectResponse) {
        option (google.api.http) = {
            get : "/v1/bindingrule/{org_id}/{name}/{uid}"
        };
    }

    rpc Enumerate(BindingRuleEnumerateRequest)
        returns (BindingRuleEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/bindingrule/{org_id}"
        };
    }

    // Auto rules only. A one-shot rule is immutable after its single
    // application -- FR-070.
    rpc Update(BindingRuleUpdateRequest)
        returns (BindingRuleUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/bindingrule"
            body : "*"
        };
    }

    // Delete leaves every Binding the rule created intact -- FR-080.
    rpc Delete(BindingRuleDeleteRequest)
        returns (BindingRuleDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/bindingrule/{org_id}/{name}/{uid}"
        };
    }

    // Journey C4. A read, not an Apply with a flag: Apply answers "what would
    // happen if I ran this", Preview answers "what does this select".
    rpc Preview(BindingRulePreviewRequest)
        returns (BindingRulePreviewResponse) {
        option (google.api.http) = {
            post : "/v1/bindingrule/preview/{org_id}"
            body : "*"
        };
    }

    rpc Apply(BindingRuleApplyRequest) returns (BindingRuleApplyResponse) {
        option (google.api.http) = {
            post : "/v1/bindingrule/apply/{org_id}/{name}/{uid}"
            body : "*"
        };
    }

    rpc UpdateOwnership(BindingRuleUpdateOwnershipRequest)
        returns (BindingRuleUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/bindingrule/updateownership/{org_id}/{name}/{uid}"
            body : "*"
        };
    }
}

// ---------------------------------------------------------------------------
// ExclusionReasonTemplate service
//
// An administrator-managed list of reasons an operator may pick from when
// holding a resource out of auto-rule scope -- FR-016. Super Admin writes,
// everyone reads.
// ---------------------------------------------------------------------------

message ExclusionReasonTemplateInfo {
    // Stored on the catalog row as AutoRuleExclusionInfo.reason_code.
    string code = 1;
    string description = 2;
    // The operator must also supply reason_text.
    bool requires_free_text = 3;
    // The operator must also supply expires_time.
    bool requires_expiry = 4;
    // An inactive template is kept for the rows that already cite it, but is
    // not offered for a new exclusion.
    bool active = 5;
}

message ExclusionReasonTemplateObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    ExclusionReasonTemplateInfo exclusion_reason_template_info = 2
        [ (gogoproto.embed) = true ];
}

message ExclusionReasonTemplateCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    ExclusionReasonTemplateInfo exclusion_reason_template = 2;
}
message ExclusionReasonTemplateCreateResponse {
    ExclusionReasonTemplateObject exclusion_reason_template = 1;
}

message ExclusionReasonTemplateInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message ExclusionReasonTemplateInspectResponse {
    ExclusionReasonTemplateObject exclusion_reason_template = 1;
}

message ExclusionReasonTemplateEnumerateRequest {
    string org_id = 1;
    bool include_inactive = 2;
}
message ExclusionReasonTemplateEnumerateResponse {
    repeated ExclusionReasonTemplateObject exclusion_reason_templates = 1;
}

message ExclusionReasonTemplateUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    ExclusionReasonTemplateInfo exclusion_reason_template = 2;
}
message ExclusionReasonTemplateUpdateResponse {
    ExclusionReasonTemplateObject exclusion_reason_template = 1;
}

message ExclusionReasonTemplateDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message ExclusionReasonTemplateDeleteResponse {}

message ExclusionReasonTemplateUpdateOwnershipRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    repeated Ownership.AccessConfig users = 4;
    repeated Ownership.AccessConfig groups = 5;
    repeated string remove_users = 6;
    repeated string remove_groups = 7;
}
message ExclusionReasonTemplateUpdateOwnershipResponse {
    ExclusionReasonTemplateObject exclusion_reason_template = 1;
}

service ExclusionReasonTemplate {
    rpc Create(ExclusionReasonTemplateCreateRequest)
        returns (ExclusionReasonTemplateCreateResponse) {
        option (google.api.http) = {
            post : "/v1/exclusionreasontemplate"
            body : "*"
        };
    }

    rpc Inspect(ExclusionReasonTemplateInspectRequest)
        returns (ExclusionReasonTemplateInspectResponse) {
        option (google.api.http) = {
            get : "/v1/exclusionreasontemplate/{org_id}/{name}/{uid}"
        };
    }

    rpc Enumerate(ExclusionReasonTemplateEnumerateRequest)
        returns (ExclusionReasonTemplateEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/exclusionreasontemplate/{org_id}"
        };
    }

    rpc Update(ExclusionReasonTemplateUpdateRequest)
        returns (ExclusionReasonTemplateUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/exclusionreasontemplate"
            body : "*"
        };
    }

    // Refused while any catalog row still cites this code. Deactivate instead.
    rpc Delete(ExclusionReasonTemplateDeleteRequest)
        returns (ExclusionReasonTemplateDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/exclusionreasontemplate/{org_id}/{name}/{uid}"
        };
    }

    rpc UpdateOwnership(ExclusionReasonTemplateUpdateOwnershipRequest)
        returns (ExclusionReasonTemplateUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/exclusionreasontemplate/updateownership/{org_id}/{name}/{uid}"
            body : "*"
        };
    }
}

// ---------------------------------------------------------------------------
// ProtectionSummary service
//
// The fleet rollup -- FR-091, FR-093. Namespaces and VMs are counted
// SEPARATELY: a VM is a resource in its own right, so folding the two into one
// number would misreport the fleet.
//
// The state is materialized on the catalog row and is never recomputed on
// read -- FR-013.
// ---------------------------------------------------------------------------

message ProtectionSummaryGetRequest {
    string org_id = 1;
    // Empty means every cluster in the caller's boundary.
    string cluster_name = 2;
    string cluster_uid = 3;
}
message ProtectionSummaryGetResponse {
    repeated ProtectionStateCount counts = 1;
    // Namespaces that hold at least one VM, so a caller can tell a mixed
    // fleet from a conventional one.
    int32 namespaces_with_virtual_machines = 2;
}

message ProtectionSummaryEnumerateRequest {
    string org_id = 1;
    GroupBy group_by = 2;

    enum GroupBy {
        GroupByInvalid = 0;
        Cluster = 1;
        Owner = 2;
    }
}
message ProtectionSummaryEnumerateResponse {
    repeated Group groups = 1;

    message Group {
        // The cluster UID or the owner id, per the requested grouping.
        string key = 1;
        string display_name = 2;
        repeated ProtectionStateCount counts = 3;
    }
}

service ProtectionSummary {
    rpc Get(ProtectionSummaryGetRequest)
        returns (ProtectionSummaryGetResponse) {
        option (google.api.http) = {
            get : "/v1/protectionsummary/{org_id}"
        };
    }

    rpc Enumerate(ProtectionSummaryEnumerateRequest)
        returns (ProtectionSummaryEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/protectionsummary/enumerate/{org_id}"
        };
    }
}

// ---------------------------------------------------------------------------
// AdminScope service -- journeys O2, O2a, O8. FR-122, FR-123.
//
// An administrator's own estate: the boundary of what that identity owns.
// Nothing in this API carried it before. Ownership is recorded per object, which
// answers "who may touch this resource" but never "what is this administrator's
// estate", so the one-scope-form rule had no home.
//
// NOT a rule. An AdminScope never re-evaluates -- see MaterializedResourceSet.
// ---------------------------------------------------------------------------

// A resource set resolved ONCE, at the delegation operation, and then frozen.
//
// FR-123 and journey O2a: later label, filter-result, discovery or inventory
// changes MUST NOT add or remove a resource. The filter is kept for audit only.
message MaterializedResourceSet {
    // Kept so an operator can see what was asked for. NEVER re-evaluated.
    ResourceFilter resolved_from = 1;
    // The frozen set. This, and only this, is the scope.
    repeated string resource_uids = 2;
    google.protobuf.Timestamp materialized_time = 3;
    // Identities whose scope already covers one of these UIDs. Journey O2a
    // warns about the overlap and confirmation creates co-ownership rather
    // than blocking or silently transferring.
    repeated string overlapping_identities = 4;
}

message AdminScopeInfo {
    // The identity this scope belongs to, as it appears in the token.
    string identity_id = 1;
    // InfraAdmin in v1. Super Admin is unscoped and App Admin scope comes from
    // resource ownership, not from this object.
    OwnerTier tier = 2;

    // EXACTLY ONE form. FR-122 forbids unioning the two, and forbids
    // accumulating several scope grants for one identity.
    oneof form {
        // Journey O2: one or more complete clusters.
        ObjectRefList whole_clusters = 3;
        // Journey O2a: a filter-assisted set, resolved once.
        MaterializedResourceSet materialized = 4;
    }

    // Super Admin only, both of them.
    string granted_by = 5;
    google.protobuf.Timestamp granted_time = 6;
    // Each change needs a fresh Super-Admin preview and an explicit commit.
    google.protobuf.Timestamp last_committed_time = 7;
}

message AdminScopeObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    AdminScopeInfo admin_scope_info = 2 [ (gogoproto.embed) = true ];
}

message AdminScopeCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    AdminScopeInfo admin_scope = 2;
}
message AdminScopeCreateResponse { AdminScopeObject admin_scope = 1; }

message AdminScopeInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message AdminScopeInspectResponse { AdminScopeObject admin_scope = 1; }

message AdminScopeEnumerateRequest {
    string org_id = 1;
    // Empty means every scoped identity.
    string identity_id = 2;
}
message AdminScopeEnumerateResponse {
    repeated AdminScopeObject admin_scopes = 1;
}

message AdminScopeUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    AdminScopeInfo admin_scope = 2;
    // Must carry the token from a preceding Preview. FR-123 requires a fresh
    // Super-Admin-initiated preview and an explicit commit for every change.
    string preview_token = 3;
}
message AdminScopeUpdateResponse { AdminScopeObject admin_scope = 1; }

message AdminScopeDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message AdminScopeDeleteResponse {}

message AdminScopePreviewRequest {
    string org_id = 1;
    string identity_id = 2;
    // The form being proposed. Exactly one, as on AdminScopeInfo.
    ObjectRefList whole_clusters = 3;
    ResourceFilter filter = 4;
}
message AdminScopePreviewResponse {
    // The exact UIDs that would be materialized. Journey O2a requires the
    // administrator to see them before committing.
    repeated CatalogResourceObject matched = 1;
    int32 matched_count = 2;
    repeated string overlapping_identities = 3;
    // Pass to AdminScope.Update to commit this exact set.
    string preview_token = 4;
}

service AdminScope {
    // Super Admin only, every call.
    rpc Create(AdminScopeCreateRequest) returns (AdminScopeCreateResponse) {
        option (google.api.http) = {
            post : "/v1/adminscope"
            body : "*"
        };
    }

    rpc Inspect(AdminScopeInspectRequest) returns (AdminScopeInspectResponse) {
        option (google.api.http) = {
            get : "/v1/adminscope/{org_id}/{name}/{uid}"
        };
    }

    rpc Enumerate(AdminScopeEnumerateRequest)
        returns (AdminScopeEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/adminscope/{org_id}"
        };
    }

    // Preview MUST precede Update. The returned token binds the commit to the
    // exact set the administrator saw.
    rpc Preview(AdminScopePreviewRequest) returns (AdminScopePreviewResponse) {
        option (google.api.http) = {
            post : "/v1/adminscope/preview/{org_id}"
            body : "*"
        };
    }

    rpc Update(AdminScopeUpdateRequest) returns (AdminScopeUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/adminscope"
            body : "*"
        };
    }

    rpc Delete(AdminScopeDeleteRequest) returns (AdminScopeDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/adminscope/{org_id}/{name}/{uid}"
        };
    }
}

// ---------------------------------------------------------------------------
// DelegationRule service -- journey F11.
//
// Delegating resources to a lower-privileged identity, by filter, in static or
// auto mode. Today a delegation writes collaborators onto each catalog row and
// DISCARDS the filter, so nothing can re-evaluate it and auto mode is
// impossible.
//
// This is NOT the same as an AdminScope. An AdminScope defines who an
// administrator is and never re-evaluates -- O2a. A DelegationRule says which
// resources a team looks after and MAY re-evaluate -- F11.
// ---------------------------------------------------------------------------

message DelegationRuleInfo {
    ResourceFilter filter = 1;
    // Who receives the access.
    string delegate_id = 2;
    Ownership.AccessType access = 3;
    // The delegate's tier. Journey F11 delegates to a LOWER privileged role.
    OwnerTier delegate_tier = 4;

    // Reuses the Placement Rule's enum rather than declaring a third one.
    PlacementRuleInfo.Mode mode = 5;
    // Super Admin or Infra Admin only -- F11. Arbitration key 1.
    OwnerTier owner_tier = 6;
    // Arbitration key 2: the older rule wins at equal tier.
    google.protobuf.Timestamp created_time = 7;
    bool enabled = 8;
    google.protobuf.Timestamp applied_time = 9;
    // The creator's authority, frozen -- FR-074.
    ResourceFilter captured_target_boundary = 10;

    // Delegating a Namespace grants the Namespace graph and all current AND
    // FUTURE child VMs. Delegating specific VMs grants neither the Namespace
    // graph nor sibling VMs. Journey F10, and acceptance scenario 2 of
    // User Story 8.
    bool include_future_children = 11;

    // Mark every delegated resource do-not-claim, so an auto Binding Rule
    // cannot take it before the delegate binds their own SLA Policy.
    bool exclude_from_auto_claim_on_delegate = 12;

    // OUTPUT_ONLY.
    google.protobuf.Timestamp last_evaluated_time = 13;
    int32 delegation_count = 14;
}

message DelegationRuleObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    DelegationRuleInfo delegation_rule_info = 2 [ (gogoproto.embed) = true ];
}

message DelegationRuleCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    DelegationRuleInfo delegation_rule = 2;
}
message DelegationRuleCreateResponse { DelegationRuleObject delegation_rule = 1; }

message DelegationRuleInspectRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message DelegationRuleInspectResponse { DelegationRuleObject delegation_rule = 1; }

message DelegationRuleEnumerateRequest {
    string org_id = 1;
    // Empty means every delegate.
    string delegate_id = 2;
    repeated PlacementRuleInfo.Mode modes = 3;
}
message DelegationRuleEnumerateResponse {
    repeated DelegationRuleObject delegation_rules = 1;
}

message DelegationRuleUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    DelegationRuleInfo delegation_rule = 2;
}
message DelegationRuleUpdateResponse {
    DelegationRuleObject delegation_rule = 1;
    int32 drift_count = 2;
}

message DelegationRuleDeleteRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
// Deleting the rule does NOT revoke what it already delegated, exactly as
// deleting a Binding Rule leaves its Bindings intact -- FR-080.
message DelegationRuleDeleteResponse {}

message DelegationRulePreviewRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    // Preview a definition that has not been created yet.
    DelegationRuleInfo candidate = 4;
}
message DelegationRulePreviewResponse {
    // Journey F11 requires Namespace and VM matches to be separable.
    repeated CatalogResourceObject matched_namespaces = 1;
    repeated CatalogResourceObject matched_virtual_machines = 2;
    int32 matched_count = 3;
    repeated ResourceCatalogPreviewResponse.SkippedResource skipped = 4;
}

message DelegationRuleApplyRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    bool dry_run = 4;
}
message DelegationRuleApplyResponse {
    int32 delegated_count = 1;
    repeated ResourceCatalogPreviewResponse.SkippedResource skipped = 2;
}

message DelegationRuleUpdateOwnershipRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    repeated Ownership.AccessConfig users = 4;
    repeated Ownership.AccessConfig groups = 5;
    repeated string remove_users = 6;
    repeated string remove_groups = 7;
}
message DelegationRuleUpdateOwnershipResponse {
    DelegationRuleObject delegation_rule = 1;
}

service DelegationRule {
    rpc Create(DelegationRuleCreateRequest)
        returns (DelegationRuleCreateResponse) {
        option (google.api.http) = {
            post : "/v1/delegationrule"
            body : "*"
        };
    }

    rpc Inspect(DelegationRuleInspectRequest)
        returns (DelegationRuleInspectResponse) {
        option (google.api.http) = {
            get : "/v1/delegationrule/{org_id}/{name}/{uid}"
        };
    }

    rpc Enumerate(DelegationRuleEnumerateRequest)
        returns (DelegationRuleEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/delegationrule/{org_id}"
        };
    }

    // Journey F11: shows Would delegate, Already delegated, Excluded, and for
    // auto mode Claimed by a higher or older rule.
    rpc Preview(DelegationRulePreviewRequest)
        returns (DelegationRulePreviewResponse) {
        option (google.api.http) = {
            post : "/v1/delegationrule/preview/{org_id}"
            body : "*"
        };
    }

    rpc Update(DelegationRuleUpdateRequest)
        returns (DelegationRuleUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/delegationrule"
            body : "*"
        };
    }

    rpc Delete(DelegationRuleDeleteRequest)
        returns (DelegationRuleDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/delegationrule/{org_id}/{name}/{uid}"
        };
    }

    // Static mode applies once on confirmation. Auto mode runs on the cycle
    // and this forces it.
    rpc Apply(DelegationRuleApplyRequest)
        returns (DelegationRuleApplyResponse) {
        option (google.api.http) = {
            post : "/v1/delegationrule/apply/{org_id}/{name}/{uid}"
            body : "*"
        };
    }

    rpc UpdateOwnership(DelegationRuleUpdateOwnershipRequest)
        returns (DelegationRuleUpdateOwnershipResponse) {
        option (google.api.http) = {
            put : "/v1/delegationrule/updateownership/{org_id}/{name}/{uid}"
            body : "*"
        };
    }
}

// ---------------------------------------------------------------------------
// DriftEvent service -- journey D5. Read only.
//
// One immutable row per rule, resource, cycle and evaluation time.
//
// Journey D5 calls this "a projection of successfully ingested Prometheus
// records, not a guaranteed complete transaction log". It is therefore NOT a
// durable audit trail, and a caller must not assume completeness. The contract
// is the same either way: whether the server backs this with a collection or
// with a metrics query is an implementation choice.
//
// Journey H5: an event cannot be accepted, ignored, acknowledged or resolved.
// There is deliberately no Update, no Delete and no acknowledge call.
// ---------------------------------------------------------------------------

message DriftEventInfo {
    ObjectRef rule_ref = 1;
    RuleKind rule_kind = 2;
    // The rule's captured tier, never its current owner's -- FR-074.
    OwnerTier rule_owner_tier = 3;
    ObjectRef resource_ref = 4;

    // Groups every event produced by one evaluation pass.
    string cycle_id = 5;
    google.protobuf.Timestamp evaluation_time = 6;
    Phase phase = 7;

    ClaimOutcome outcome = 8;
    // Human detail. Prefer `outcome` for any decision.
    string reason_detail = 9;

    ProtectionState pre_state = 10;
    ProtectionState post_state = 11;

    // Set when outcome is SkippedClaimedByOtherRule.
    //
    // REDACTED for a caller below the winning rule's owner tier. Naming it
    // would tell a scoped administrator that a stronger tier's rule exists and
    // what it is called, which multi-tenancy isolation forbids -- journey F7.
    ObjectRef winning_rule_ref = 12;
    // The assignment or Binding that resulted, or that was retained.
    ObjectRef resulting_object_ref = 13;

    enum Phase {
        PhaseInvalid = 0;
        PlacementPhase = 1;
        BindingPhase = 2;
        DelegationPhase = 3;
        DriftPhase = 4;
    }
}

message DriftEventObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    DriftEventInfo drift_event_info = 2 [ (gogoproto.embed) = true ];
}

message DriftEventEnumerateRequest {
    string org_id = 1;
    // Any combination. Empty means no filter on that dimension.
    ObjectRef rule_ref = 2;
    string resource_uid = 3;
    string cycle_id = 4;
    repeated ClaimOutcome outcomes = 5;
    google.protobuf.Timestamp from_time = 6;
    google.protobuf.Timestamp to_time = 7;
    int32 page_size = 8;
    string page_token = 9;
}
message DriftEventEnumerateResponse {
    repeated DriftEventObject drift_events = 1;
    string next_page_token = 2;
    // True when the backing projection may have dropped records, so the caller
    // does not present an incomplete list as complete -- journey D5.
    bool may_be_incomplete = 3;
}

message DriftEventInspectRequest {
    string org_id = 1;
    string uid = 2;
}
message DriftEventInspectResponse { DriftEventObject drift_event = 1; }

service DriftEvent {
    rpc Enumerate(DriftEventEnumerateRequest)
        returns (DriftEventEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/driftevent/{org_id}"
        };
    }

    rpc Inspect(DriftEventInspectRequest) returns (DriftEventInspectResponse) {
        option (google.api.http) = {
            get : "/v1/driftevent/{org_id}/{uid}"
        };
    }
}

// ---------------------------------------------------------------------------
// Three calls that existing services were missing.
// ---------------------------------------------------------------------------

// Journey C4: preview and review a Binding Rule's target set.
message BindingRulePreviewRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
    // Preview a definition that has not been created yet.
    BindingRuleInfo candidate = 4;
}
message BindingRulePreviewResponse {
    // C4 requires Namespace and VM matches to be shown apart -- FR-093.
    repeated CatalogResourceObject matched_namespaces = 1;
    repeated CatalogResourceObject matched_virtual_machines = 2;
    int32 matched_count = 3;
    // Classified, not free text. Already bound always means skip.
    repeated ResourceCatalogPreviewResponse.SkippedResource skipped = 4;
    // C4: show every VM's parent Namespace, and identify graph ownership,
    // so an operator can see what a VM match really covers.
    repeated VirtualMachineParent vm_parents = 5;

    message VirtualMachineParent {
        string vm_resource_uid = 1;
        string parent_namespace_uid = 2;
        string parent_namespace_name = 3;
        // True when the parent Namespace is also in this match set.
        bool parent_also_matched = 4;
    }
}

// Journey B13: a read-only translated-mechanics preview of a reusable SLA
// Policy. What the plain-language intents mean in schedules, copies and capture.
message SLAPolicyPreviewMechanicsRequest {
    string org_id = 1;
    string name = 2;
    string uid = 3;
}
message SLAPolicyPreviewMechanicsResponse {
    repeated IntentMechanics intents = 1;

    message IntentMechanics {
        string intent_id = 1;
        // Rendered for a human, for example "every 15 minutes".
        string frequency = 2;
        google.protobuf.Duration recoverability_period = 3;
        // The derived copy count: ceil(period / longest gap), floored at 1.
        // A user states a business need and does not do this arithmetic --
        // 7 days at 15 minutes is 672 copies per resource.
        int32 derived_retain_count = 4;
        int64 incremental_count = 5;
        ProtectionIntent.CaptureMode capture_mode = 6;
        bool require_snapshot_capture = 7;
        ProtectionIntent.Classification classification = 8;
    }
}

// Journey M2: DR restore when the source cluster is gone.
//
// A recovery point is reached through its catalog resource, so a resource whose
// cluster no longer exists cannot be restored from. This recreates the catalog
// row from a backup's stored metadata, with no live cluster to discover.
message ResourceCatalogReconstructRequest {
    string org_id = 1;
    // The backup holding the resource's metadata.
    ObjectRef backup_ref = 2;
    // Which resource inside it. Its original Kubernetes UID.
    string resource_uid = 3;
    // Where the reconstructed row is anchored. May differ from the original.
    ObjectRef target_cluster_ref = 4;
}
message ResourceCatalogReconstructResponse {
    CatalogResourceObject resource = 1;
    // Recovery points relinked to the reconstructed row.
    int32 relinked_recovery_point_count = 2;
}
