    string uid = 4;
    // List of exact backup schedules to include (name + UID required).
    repeated ObjectRef include_objects = 5;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 6;
    // multiple policy reference for filtering
    repeated ObjectRef policy_ref = 7;
    // List of exact backup schedules to exclude (name + UID required).
    repeated ObjectRef exclude_objects = 8;
    // Substring or regex pattern to match backup schedules and include (e.g. "*" for All, "pxb-" or any valid regex)
    // Cannot be used with include_objects.
    string include_filter = 9;
    // Substring or regex pattern to match backup schedules and exclude (e.g. "*" for All, "pxb-" or any valid regex)
    // Cannot be used with exclude_objects.
    string exclude_filter = 10;
    // option to provide clusterRef to delete the backupschedule from cluster
    ClusterScope cluster_scope = 11;
    // bulk_uid_check_relaxation - This flag needs to be set to relax the UID check for bulk update operations.
    // In a bulk operation, the user will pass multiple filter options to select a list of BackupSchedule objects.
    // For example, the user may send a schedulePolicyRef object to filter BackupSchedules that use that SchedulePolicy.
    // If the user provides only the name in the schedulePolicyRef, and there are multiple SchedulePolicy objects with the same name,
    // we cannot return an error. Therefore, we require the user to explicitly confirm acceptance of the side effects of UID relaxation.
    bool bulk_uid_check_relaxation = 12;
    // Selectors narrowing which schedules a bulk delete acts on.
    BackupScheduleDeleteFilterOptions filter_options = 13;
}

// Define BackupScheduleDeleteResponse struct
message BackupScheduleDeleteResponse {}

service Cluster {

    // Creates a new cluster
    rpc Create(ClusterCreateRequest) returns (ClusterCreateResponse) {
        option (google.api.http) = {
            post : "/v1/cluster"
            body : "*"
        };
    }

    // Update given cluster details
    rpc Update(ClusterUpdateRequest) returns (ClusterUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/cluster"
            body : "*"
        };
    }

    // Enumerate returns a list of clusters
    rpc Enumerate(ClusterEnumerateRequest) returns (ClusterEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/cluster/{org_id}"
            additional_bindings {
                post: "/v1/cluster/{org_id}/enumerate"
                body: "*"
            }
        };
    }

    // Inspect returns detail information about a specified cluster
    rpc Inspect(ClusterInspectRequest) returns (ClusterInspectResponse) {
        option (google.api.http) = {
            get : "/v1/cluster/{org_id}/{name}"
        };
    }

    // Delete removes a cluster
    rpc Delete(ClusterDeleteRequest) returns (ClusterDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/cluster/{org_id}/{name}"
        };
    }

    // UpdateBackupShare updates ownership details for backup share at cluster
    // level
    rpc UpdateBackupShare(ClusterBackupShareUpdateRequest)
        returns (ClusterBackupShareUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/cluster/updatebackupshare"
            body : "*"
        };
    }

    // ShareCluster shares access to the cluster to the user(s) or group(s)
    rpc ShareCluster(ShareClusterRequest) returns (ShareClusterResponse) {
        option (google.api.http) = {
            patch : "/v1/sharecluster"
            body : "*"
        };
    }

    // UnShareCluster removes shared access for the user(s) or group(s) to the cluster
    rpc UnShareCluster(UnShareClusterRequest) returns (UnShareClusterResponse) {
        option (google.api.http) = {
            patch : "/v1/unsharecluster"
            body : "*"
        };
    }
}

message ClusterBackupShareUpdateRequest {
    string org_id = 1;
    string name = 2;
    BackupShare add_backup_share = 3;
    BackupShare del_backup_share = 4;
    string uid = 5;
}


message ClusterBackupShareUpdateResponse {}

// Define ClusterCreateRequest struct
message ClusterCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    PXConfig px_config = 2 [ (gogoproto.jsontag) = "pxconfig" ];
    string kubeconfig = 3 [
        (gogoproto.jsontag) = "kubeconfig",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 4;
    ObjectRef cloud_credential_ref = 5;
    ObjectRef platform_credential_ref = 6;
    // Teleport cluster ID
    string teleport_cluster_id = 7;
    // Tenant ID of the user account (aka PDS account)
    string tenant_id = 8;
    // PDS account service token to fetch rest.Config for
    // teleport based cluster
    string service_token = 9 [
        (gogoproto.jsontag) = "servicetoken",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // This is optional field and used by BaaS only
    Provider provider = 10;
     // Cloud provider type
    enum Provider {
        Invalid = 0;
        AWS = 1;
        Azure = 2;
        Google = 3;
        IBM = 4;
        Rancher = 5;
    }
}

// Define ClusterCreateResponse struct
message ClusterCreateResponse {
    ClusterObject cluster = 1;
}

// Define ClusterUpdateRequest struct
message ClusterUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    PXConfig px_config = 2 [ (gogoproto.jsontag) = "pxconfig" ];
    string kubeconfig = 3 [
        (gogoproto.jsontag) = "kubeconfig",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 4;
    ObjectRef cloud_credential_ref = 5;
    ObjectRef platform_credential_ref = 6;
}

// Define ClusterUpdateResponse struct
message ClusterUpdateResponse {}

// Advanced filter options for cluster enumeration.
message ClusterEnumerateOptions {
    // Filter by Gardener project name(s). Matches against GardenerShootInfo.project_name.
    repeated string project_names = 1;
    // Filter by ClusterDiscoveryConfig(s). Matches against GardenerShootInfo.cluster_discovery_config_refs.
    repeated ObjectRef cluster_discovery_config_refs = 2;
    // Matches against GardenerShootInfo.labels.
    string shoot_label_selector = 3;
    // Filter by cluster status. Only return clusters matching any of the specified statuses.
    // Supported statuses: Success, Failed, DeletePending, Pending.
    repeated ClusterInfo.StatusInfo.Status cluster_status = 4;
    // Filter by managed state. When set, only returns clusters where
    // GardenerShootInfo.managed matches this value.
    google.protobuf.BoolValue managed = 5;
    // Filter by cluster cloud provider. Only return clusters matching any of
    // the specified providers (AWS, Azure, Google, IBM, Rancher, Harvester, Other).
    repeated ClusterInfo.Provider cluster_providers = 6;
}

// Define ClusterEnumerateRequest struct
message ClusterEnumerateRequest {
    string org_id = 1;
    // label selectors for the object for filtering
    map<string, string> labels = 2;
    bool include_secrets = 3;
    // cloud credential name.
    // Enumerate will return list of cluster that
    // uses this cloud credential
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 4;
    ObjectRef cloud_credential_ref = 5;
    // Set this to true, to get the backupshare enabled cluster list
    bool only_backup_share = 6;
    // Optional arguments for enumeration - Sorting, Pagination
    EnumerateOptions enumerate_options = 7;
    // Optional filter to return only clusters that are referenced by the specified BackupLocation.
    // If not provided, return ALL clusters (existing behavior).
    // If provided, return ONLY clusters that have "blName/blUID" as a key in their backup_location_ref_status map.
    // This enables bidirectional querying: "Show me all clusters that can access this BackupLocation"
    ObjectRef backup_location_ref = 8;
    // Advanced filter options for cluster enumeration.
    ClusterEnumerateOptions cluster_enumerate_options = 9;
}

// Define ClusterEnumerateResponse struct
message ClusterEnumerateResponse {
    repeated ClusterObject clusters = 1;
    // Total count of clusters matching the filter
    uint64 total_count = 2;
    // Indicates if the result set is complete
    bool complete = 3;
}

// Define ClusterInspectRequest struct
message ClusterInspectRequest {
    string org_id = 1;
    string name = 2;
    bool include_secrets = 3;
    string uid = 4;
}

// Define ClusterInspectResponse struct
message ClusterInspectResponse { ClusterObject cluster = 1; }

// Define ClusterDeleteRequest struct
message ClusterDeleteRequest {
    string org_id = 1;
    string name = 2;
    // delete_backups is deprecated, not to be used.
    bool delete_backups = 3;
    // delete_restores indicates whether the restore related to cluster  need to
    // be deleted or retained.
    bool delete_restores = 4;
    // indicate the uid of the particular object
    string uid = 5;
    // delete_all_cluster_backup if set will delete all backups on the cluster
    // allowed only to super admin Role
    bool delete_all_cluster_backups = 6;
}

// Define ClusterInspectResponse struct
message ClusterDeleteResponse {}


message ShareClusterRequest{
    string org_id = 1;
    ObjectRef cluster_ref = 2;
    // userid of the user(s) to share the cluster with
    repeated string users = 3;
    // group(s) to share the cluster with
