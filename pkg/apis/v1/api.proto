service Metrics {
    // Returns metrics details of backups
    rpc Inspect(MetricsInspectRequest) returns (MetricsInspectResponse) {
        option (google.api.http) = {
            get : "/v1/metrics/{org_id}"
        };
    }

    // Pass metrics from other pods to px-backup, which will push as px-backup metrics to Prometheus
    rpc Create(MetricsCreateRequest) returns (MetricsCreateResponse) {
        option (google.api.http) = {
            post : "/v1/metrics/{org_id}"
            body : "*"
        };
    }
}

message MetricsCreateRequest {
   string org_id = 1;
   MetricsInfo metrics_info = 2;

}

message MetricsInfo {
    Type type = 1;

    // Check with charts/px-central/templates/px-backup/pxcentral-prometheus.yaml before
    // adding Type here, few metrics are ignored.
    enum Type {
        Invalid = 0;
        BackupStatus = 1;
        BackupResourceCount = 2;
        BackupLocationStatus = 3;
        ClusterStatus = 4;
        RestoreStatus = 5;
    }

    oneof MetricData {
        BackupObject  backup = 100;
    }

}

message MetricsCreateResponse {}

message MetricsInspectRequest { string org_id = 1; }

message MetricsInspectResponse {
    repeated Stats stats = 1;
    // Time at which last stats data was synced in epoch time format
    int64 last_sync_time = 2;
    message Stats {
        string cluster = 1;
        uint64 num_namespaces = 2;
        uint64 total_backup_size = 3;
        uint64 num_schedules = 4;
        ObjectRef cluster_ref = 5;
        uint64 total_namespaces = 6;
    }
}

service Backup {
    // Creates a new backup object
    rpc Create(BackupCreateRequest) returns (BackupCreateResponse) {
        option (google.api.http) = {
            post : "/v1/backup"
            body : "*"
        };
    }

    // Update given backup details
    rpc Update(BackupUpdateRequest) returns (BackupUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/backup"
            body : "*"
        };
    }

    // Enumerate returns a list of objects
    rpc Enumerate(BackupEnumerateRequest) returns (BackupEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/backup/{org_id}"
            additional_bindings {
                post: "/v1/backup/{org_id}/enumerate"
                body: "*"
            }
        };
    }

    // Inspect returns detail information about a specified object
    rpc Inspect(BackupInspectRequest) returns (BackupInspectResponse) {
        option (google.api.http) = {
            get : "/v1/backup/{org_id}/{name}"
        };
    }

    // Delete triggers delete of a backup
    rpc Delete(BackupDeleteRequest) returns (BackupDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/backup/{org_id}/{name}"
            additional_bindings {
                post: "/v1/backup/{org_id}/delete" // for bulk delete
                body: "*"
            }
        };
    }

    // UpdateBackupShare updates backupshare of existing backup object
    rpc UpdateBackupShare(BackupShareUpdateRequest)
        returns (BackupShareUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/backup/updatebackupshare"
            body : "*"
        };
    }
    // GetBackupResourceDetails returns detailed information about resources of a backup
    rpc GetBackupResourceDetails(BackupResourceDetailGetRequest) returns (BackupResourceDetailGetResponse) {
        option (google.api.http) = {
            post: "/v1/backup/getbackupresourcedetails"
            body: "*"
        };
    }
    // RetryBackupResources retries backup of a failed or partial success backup
    rpc RetryBackupResources(BackupRetryRequest)
        returns (BackupRetryResponse) {
        option (google.api.http) = {
            put : "/v1/backup/retryBackupResources"
            body : "*"
        };
    }
}

// Request message structure for backup create
message BackupCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // Name or UID + orgid of BackupLocation
    // backup_location is deprecated, not to be used.
    string backup_location = 2;
    // Name or UID of Cluster
    string cluster = 3;
    // Namespaces to backup. Only an admin can provide multiple namespaces
    repeated string namespaces = 4;
    // Label selectors to choose resources
    map<string, string> label_selectors = 5;
    // Pre check rule to run before backup is started
    // deprecated, not to be used.
    string pre_exec_rule = 6;
    // Post check rule to run after backup is completed
    // deprecated, not to be used.
    string post_exec_rule = 7;
    // List of resources to backup (optional)
    repeated ResourceInfo include_resources = 8;
    // Snapshot class name to use for backup (optional)
    // deprecated, not to be used.
    string csi_snapshot_class_name = 9;
    // List of resource types to backup (optional)
    repeated string resource_types = 10;
    ObjectRef backup_location_ref = 11;
    ObjectRef pre_exec_rule_ref = 12;
    ObjectRef post_exec_rule_ref = 13;
    // To get type of backup (generic or non-generic)
    BackupType backup_type = 14;
    ObjectRef cluster_ref = 15;
    string ns_label_selectors = 16;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 17;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 18;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 19;
    // option to take backup as direct kdmp
    bool direct_kdmp = 20;
    repeated string exclude_resource_types = 21;
    // option to enable to keep the CR status of the resources in the backup.
    bool keep_cr_status = 22;
    // older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 23;
    // reference to volumeResourceOnly policy object
    ObjectRef volume_resource_only_policy_ref = 24;



    enum BackupType {
        Invalid = 0;
        Generic = 1;
        Normal = 2;
    }
    message BackupObjectType {
        Type type = 1;
         enum Type {
             Invalid = 0;
             All = 1; // for All application backup
             VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
         }
     }
}

// Response message structure for backup create
message BackupCreateResponse {
    BackupObject backup = 1;
}

// Define BackupUpdateRequest struct
message BackupUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // Reference to cloud credential object used for backup
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 2;
    ObjectRef cloud_credential_ref = 3;
}

// Define BackupUpdateResponse struct
message BackupUpdateResponse {}

// Remark represents a user comment why is he performing the action
message Remark {
    // The actual remark/comment text
    string comment = 1;
    // Username of the person making the remark
    string updated_by = 2;
    // Timestamp when the remark was made
    google.protobuf.Timestamp updated_at = 3;
}

//  Request message structure for enumerate object
message BackupEnumerateRequest {
    // Organization id
    string org_id = 1;
    // Optional arguments for enumeration
    EnumerateOptions enumerate_options = 2 [ (gogoproto.embed) = true ];
}

//  Response message structure for enumerate create
message BackupEnumerateResponse {
    repeated BackupObject backups = 1;
    uint64 total_count = 2;
    bool complete = 3;
}

// Request message structure for object inspect
message BackupInspectRequest {
    string name = 1;
    string org_id = 2;
    string uid = 4;
}

// Response message structure for object inspect
message BackupInspectResponse { BackupObject backup = 1; }

// Advanced filter options for bulk backup deletion. These narrow the set of
// backups selected for deletion and behave the same as the identically-named
// fields in EnumerateOptions.
message BackupDeleteEnumerateOptions {
    // label selectors for the object for filtering
    map<string, string> labels = 1;
    // Time range for which to delete objects
    TimeRange time_range = 2;
    // Filter to use owner uids on objects. Any object that contains the
    // filter will be returned
    repeated string owners = 3;
    // Filter by backup object type (application/namespace vs VirtualMachine).
    // Unset = no object-type filter.
    BackupInfo.BackupObjectType backup_object_type = 4;
    // Filter by one or more Backup StatusInfo.Status values.
    // Empty list = no status filter.
    repeated BackupInfo.StatusInfo.Status statuses = 5;
    // filter to use policy name and uid. Any object that contains the filter will be returned.
    repeated ObjectRef schedule_policy_ref = 6;
    // filter to use backup schedule policy name and uid. Any object that contains the filter will be returned.
    repeated ObjectRef backup_schedule_ref = 7;
}

// Request message structure for object delete
message BackupDeleteRequest {
    string name = 1;
    string org_id = 2;
    // cluster name or uid to perform delete through (single delete only;
    // bulk delete selects clusters via cluster_scope below)
    string cluster = 3;
    string uid = 4;
    ObjectRef cluster_ref = 5;
    // force allows the removal of backup metadata when the underlying cluster is gone.
    // WARNING: This only deletes the record from MongoDB and skips physical cleanup
    // of the backup location. To ensure full data deletion, prefer registering a
    // temporary cluster with the same backup location. Use this flag only for
    // orphaned metadata where the actual backup data is no longer needed.
    // NOTE: This option is only valid in federated mode and will return an error
    // in non-federated mode.
    bool force = 6;
    // Bulk delete fields. Set at least one of these instead of name/uid above
    // to delete multiple backups in a single request.

    // Backups to include. UID is optional - a name alone works, but if the name
    // matches more than one backup the request is rejected and you must pass the UID.
    // Can't be used with include_filter or exclude_objects.
    repeated ObjectRef include_objects = 7;
    // Backups to exclude. UID is optional. Can't be used with exclude_filter.
    repeated ObjectRef exclude_objects = 8;
    // Regex/substring matched against backup names to include. Can't be used with include_objects.
    string include_filter = 9;
    // Regex/substring matched against backup names to exclude. Can't be used with exclude_objects.
    string exclude_filter = 10;
    // Only delete backups in these backup locations. Name is required, UID optional.
    repeated ObjectRef backup_location_ref = 11;
    // Only delete backups from these clusters, or all clusters. Names are required, UIDs optional.
    ClusterScope cluster_scope = 12;
    // acknowledge must be set to true for a bulk delete request to proceed.
    // It acts as an explicit confirmation that the caller intends to delete
    // multiple backups. If it is not set to true, the bulk delete is rejected.
    bool acknowledge = 13;
    // Advanced filter options for bulk delete.
    BackupDeleteEnumerateOptions backup_delete_enumerate_options = 14;
}

// Response message structure for object delete
message BackupDeleteResponse {}

// Request message for backup share update request
message BackupShareUpdateRequest {
    string org_id = 1;
    // Backup to be updated
    string name = 2;
    BackupShare backupshare = 3;
    string uid = 4;
}

// Request message for retrying failed backup
message BackupRetryRequest {
    // Organization id
    string org_id = 1;
    // Name of the failed or partial success backup to be retried
    string name = 2;
    // UID of the failed or partial success backup to be retried
    string uid = 3;
    // List of failed VirtualMachine resource only. If not passed, will retry all Failed VMs from Backup object.
    repeated ResourceInfo include_resources = 4;
    // skip_vm_auto_exec_rules when set to true will take crash-consistent backup for retry
    bool skip_vm_auto_exec_rules = 5;
}

// Response message for BackupRetryRequest
message BackupRetryResponse {
    // Auto-generated backup name format : <original backup name>-retry{count}-<epoch> ;
    BackupObject backup = 1;
}


// Response message for backup share update request
message BackupShareUpdateResponse {}

message NamespaceFilter {
    // Substring or regex pattern to match namespace name and include (e.g. "*" for All, "pxb-" or any valid regex)
    string namespace_name_pattern = 1;
    // List of namespace names to include for filtering
    repeated string include_namespaces = 2;
    // Filter by exclude namespaces for filtering
    repeated string exclude_namespaces = 3;
    // List of resources to include for filtering
    repeated ResourceInfo include_resources = 4;
    // List of resources to exclude for filtering
    repeated ResourceInfo exclude_resources = 5;
    // gvks represents a list of Kubernetes Group/Version/Kind (GVK) identifiers.
    // Each GVK follows the format "group/version/kind" (e.g., "apps/v1/Deployment").
    // This field is used to filter resources based on their GVK.
    repeated string gvks = 6;
    // Substring or regex pattern to match resource name and include (e.g. "*" for All, "pxb-" or any valid regex)
    string resource_name_pattern = 7;
}

message VirtualMachineFilter {
    // Substring or regex pattern to match virtual machine name and include (e.g. "*" for All, "pxb-" or any valid regex)
    string vm_name_pattern = 1;
    // List of os names to include for filtering
    repeated string os_name = 2;
    // List of vms to include for filtering
    repeated BackupInfo.VirtualMachineInfo include_vms = 3;
    // List of vms to exclude for filtering
    repeated BackupInfo.VirtualMachineInfo exclude_vms = 4;
}

// VirtualMachineRestoreFilter — restore-side analogue of VirtualMachineFilter.
// include_vms / exclude_vms identify VMs by name + namespace using the shared
// VirtualMachine message.
message VirtualMachineRestoreFilter {
    // Substring or regex pattern to match VM name (e.g. "*" for All, "pxb-" or any valid regex)
    string vm_name_pattern = 1;
    // List of os names to include for filtering
    repeated string os_name = 2;
    // List of VMs to include for filtering
    repeated VirtualMachine include_vms = 3;
    // List of VMs to exclude for filtering
    repeated VirtualMachine exclude_vms = 4;
}

// Request message to detailed backup resources
message BackupResourceDetailGetRequest {
    string org_id = 1;
    // Backup name
    string name = 2;
    // Backup uid
    string uid = 3;
    // Filter options
    Filter filter = 4;
    // Filter to apply on resources
    message Filter {
        // resource filter
        oneof resource_filter {
            NamespaceFilter namespace_filter = 1;
            VirtualMachineFilter virtual_machine_filter = 2;
        }
        // filter based on the status.
        // Need to pass the string value of the status field of resources
        // For example, {"Success", "Failed"}
        // default will be {"Success"}, when no value is passed
        repeated string status = 3;
        // max objects to fetch
        uint64 max_objects = 4;
        // object index from which to start fetching
        uint64 object_index = 5;
    }
    // force_resync has to be set to resync the failed sync process
    bool force_resync = 5;
    // sync_namespaces_only when set to true will sync only the namespaces
    bool sync_namespaces_only = 6;
}
message BackupResourceDetailGetResponse{
   BackupResourceObject backup = 1;
}

message BackupResourceObject {
    Metadata metadata = 1
    [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    // Name of Cluster
    string cluster = 2;
    // Label selectors to choose resources
    map<string, string> label_selectors = 3;
    BackupInfo.StatusInfo status = 4;
    BackupInfo.Stage stage = 5;
    uint64 total_size = 6;
    string csi_snapshot_class_name = 7;
    repeated string resource_types = 8;
    ObjectRef backup_location_ref = 9;
    ObjectRef cluster_ref = 10;
    string ns_label_selectors = 11;
    // Name of rancher projects associated with resources
    map<string, string> rancher_projects = 12;
    // option to take backup as direct kdmp
    bool direct_kdmp = 13;
    // this flag signifies if the backup involves large number of resources or not
    bool large_resource_enabled = 14;
    // backup object type is all namespace or virtualMachine specific backup
    BackupInfo.BackupObjectType backup_object_type = 15;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 16;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 17;
    google.protobuf.Timestamp retention_time = 18;
    // this will store the completion time of the volumes, resources and total backup
    completionTimeInfo completion_time_info = 19;
    // older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 20;
    int64  virtual_machines_total_count = 21;
    int64  virtual_machines_failed_count = 22;
    // List of namespaces associated with the backup
    repeated string namespaces = 23;
    repeated BackupInfo.Volume volumes = 24;
    repeated ResourceInfo resources = 25;
    ResourceContainer resource_details = 26;
    // Total count of resources matching filter
    uint64 total_resource_count = 27;
    // list of filtered namespaces
    repeated FilteredNamespaceInfo filtered_namespaces = 28;
    oneof sync_type {
        // resources sync status information
        SyncStatusInfo resources_sync_status_info = 29;
        // namespace sync status information
        SyncStatusInfo namespace_sync_status_info = 30;
    }

    // Message for maintaining status of sync operations
    message SyncStatusInfo {
        Status status = 1;
        string reason = 2;
         // When this status was last updated, this will be used for TTL calculation
        google.protobuf.Timestamp updated_at = 3;

        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Completed = 3;
            Failed = 4;
        }
    }

    // Resources details mapped to either Namespace or virtualMachine
    message ResourceContainer {
        oneof resource_list{
            // List of resources mapped to virtualMachine
            VirtualMachineList virtual_machine_list = 1;
	    // TODO:  NamespaceList namespace_list = 2; for NS specific backup resources
        }
    }

    // VirtualMachine Detail info List
    message VirtualMachineList {
        repeated VirtualMachineDetailInfo virtual_machines = 1;
        // List of unique OS names for all VMs in this backup
        repeated string vm_guest_os_names_in_backup = 2;
    }

    // VirtualMachine Detail info with volumes and resources
    message VirtualMachineDetailInfo {
        BackupInfo.VirtualMachineInfo vm_info = 1;
        repeated VolumeDetails volumes = 2;
        repeated ResourceDetails resources = 3;
    }

    // Volume details
    message VolumeDetails {
        string name = 1;
        uint64 size = 2;
        BackupInfo.Volume.BackupMode backup_mode = 3;
        BackupInfo.StatusInfo status = 4;
    }

    // Resource Info details
    message ResourceDetails {
        string name = 1;
        string group = 3;
        string kind = 4;
        string version = 5;
        BackupInfo.StatusInfo status = 6;
    }

    // Filtered Namespaces along with associated resource types
    message FilteredNamespaceInfo {
        string namespace = 1;
        repeated string resource_types = 2;
    }
}

// RestoreResourceObject is the response object for GetRestoreResourceDetails.
// Each entry in virtual_machines is a VirtualMachineDetail carrying the virtual
// machine identity, its restore status, its list of volumes and resources, and
// the computed restore statistics.
message RestoreResourceObject {
    Metadata metadata = 1
    [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    string cluster = 2;
    map<string, string> namespace_mapping = 3;
    map<string, string> storage_class_mapping = 4;
    ReplacePolicy.Type replace_policy = 5;
    RestoreInfo.StatusInfo status = 6;
    uint64 total_size = 7;
    ObjectRef backup_location_ref = 8;
    ObjectRef cluster_ref = 9;
    ObjectRef backup_ref = 10;
    BackupObjectType backup_object_type = 11;

    // Aggregate per-VM counts for a virtual machine restore.
    int64 virtual_machines_total_count  = 12;
    int64 virtual_machines_failed_count = 13;
    // Per-VM detail. Empty for namespace-scoped restores, or restores that do
    // not provide per-VM detail.
    repeated VirtualMachineDetail virtual_machines = 14;

    // Filtered/paginated detail arrays.
    repeated RestoreInfo.Volume volumes = 15;
    repeated RestoreInfo.RestoredResource resources = 16;
    // Total count of resources matching the filter (for pagination).
    uint64 total_resource_count = 17;
    // Namespaces filtered for this restore.
    repeated FilteredNamespaceInfo filtered_namespaces = 18;

    // Nested for parity with BackupResourceObject.FilteredNamespaceInfo.
    message FilteredNamespaceInfo {
        string namespace = 1;
        repeated string resource_types = 2;
    }
}

// Request message for paginated/filtered restore resource details.
message RestoreResourceDetailGetRequest {
    string org_id = 1;
    // Restore name
    string name = 2;
    // Restore uid
    string uid = 3;
    // Filter options
    Filter filter = 4;

    // Filter to apply on resources
    message Filter {
        // Resource filter — either by namespace or by virtual machine, not both.
        oneof resource_filter {
            NamespaceFilter namespace_filter = 1;
            VirtualMachineRestoreFilter virtual_machine_filter = 2;
        }
        // Status filter, e.g. {"Failed"} to fetch only failed entries.
        // Default is {"Success"} when empty.
        repeated string status = 3;
        // Maximum number of entries to return.
        uint64 max_objects = 4;
        // Pagination cursor.
        uint64 object_index = 5;
    }
}

message RestoreResourceDetailGetResponse {
    RestoreResourceObject restore = 1;
}

service Restore {
    // Creates new restore object in datastore
    // It will also trigger a restore operation on the target cluster
    rpc Create(RestoreCreateRequest) returns (RestoreCreateResponse) {
        option (google.api.http) = {
            post : "/v1/restore"
            body : "*"
        };
    }

    // Update given restore details
    rpc Update(RestoreUpdateRequest) returns (RestoreUpdateResponse) {
        option (google.api.http) = {
            put : "/v1/restore"
            body : "*"
        };
    }

    // Enumerate returns a list of restore objects
    rpc Enumerate(RestoreEnumerateRequest) returns (RestoreEnumerateResponse) {
        option (google.api.http) = {
            get : "/v1/restore/{org_id}"
        };
    }

    // Inspect returns detailed information about specified restore object
    rpc Inspect(RestoreInspectRequest) returns (RestoreInspectResponse) {
        option (google.api.http) = {
            get : "/v1/restore/{org_id}/{name}"
        };
    }

    // GetRestoreResourceDetails returns paginated/filtered restore resource
    // details (parallel to Backup.GetBackupResourceDetails). Old servers
    // respond UNIMPLEMENTED; UI should fall back to Inspect for those.
    rpc GetRestoreResourceDetails(RestoreResourceDetailGetRequest) returns (RestoreResourceDetailGetResponse) {
        option (google.api.http) = {
            post : "/v1/restore/getrestoreresourcedetails"
            body : "*"
        };
    }

    // Delete removes a restore object
    rpc Delete(RestoreDeleteRequest) returns (RestoreDeleteResponse) {
        option (google.api.http) = {
            delete : "/v1/restore/{org_id}/{name}"
        };
    }

    // Return the access details for a restore CR file.
    //
    // For S3 / Azure / Google backends: a short-lived signed URL. Client
    // fetches bytes directly from the storage backend.
    //
    // For NFS backends: the NFS server address + export + file path.
    // Client mounts the NFS export using its own tools (mount / scp /
    // rsync) and reads the file. Client's NFS connectivity is the
    // client's responsibility -- px-backup does NOT provision any
    // in-cluster infrastructure for NFS downloads.
    //
    // The CR file name is derived server-side from the restore record --
    // one restore has exactly one CR file (Stork naming convention:
    // "restore-crs/<restore-name>-<short-uid>.json"). The client does
    // NOT pass a file-name / object-key field.
    rpc GetRestoreCRDownloadLocation(RestoreCRDownloadLocationRequest)
        returns (RestoreCRDownloadLocationResponse) {
        option (google.api.http) = {
            get : "/v1/restore/{org_id}/{name}/crDownloadLocation"
        };
    }
}

// Request for GetRestoreCRDownloadLocation.
message RestoreCRDownloadLocationRequest {
    // Org scope (matches every other Restore RPC).
    string org_id = 1;

    // Restore name.
    string name = 2;

    // Restore uid.
    string uid = 3;

    // Signed URL lifetime in seconds. Applies ONLY to S3 / Azure /
    // Google backends. Server clamps to [60, 604800] (1 min to 7 days).
    // Zero or unset -> default 1800 (30 minutes). Ignored for NFS.
    uint32 expiry_seconds = 4;
}

// Response for GetRestoreCRDownloadLocation.
message RestoreCRDownloadLocationResponse {
    // Backend type -- reuses the existing BackupLocationInfo.Type enum
    // (Invalid / S3 / Azure / Google / NFS). Client uses this to pick
    // the right access method AND to know which `location` oneof field
    // to read.
    BackupLocationInfo.Type backend_type = 1;

    // Access details -- exactly one of `signed_url` or `nfs_location` is
    // populated, determined by backend_type. Structuring the URL and
    // its expiry as a nested SignedURLLocation (rather than flat fields
    // on this message) makes it architecturally impossible for
    // `expires_at` to appear in an NFS response -- avoiding the
    // proto3 Timestamp-defaults-to-1970 leakage pitfall.
    oneof location {
        // S3 / Azure / Google -- pre-signed URL + expiry bundle.
        SignedURLLocation signed_url = 2;

        // NFS -- server + path metadata. Client mounts the export and
        // reads <export_path>/<file_path> after mount.
        NFSLocation nfs_location = 3;
    }
}

// Signed URL access details returned for S3 / Azure / Google -backed
// BackupLocations. Client fetches bytes directly from the storage
// backend via HTTP GET on the URL.
message SignedURLLocation {
    // Pre-signed HTTPS URL for the CR object. Multi-use within the
    // expiry window. MUST NOT be logged (contains a signed credential
    // in the query parameters).
    string url = 1;

    // Wall-clock expiry timestamp of the signed URL. Client SHOULD use
    // this to display "expires in Xm" UI hints; MUST NOT rely on it for
    // enforcement (the backend enforces via the embedded signature).
    google.protobuf.Timestamp expires_at = 2;
}

// NFS access details returned when the BackupLocation is NFS-backed.
// Client is responsible for NFS connectivity -- px-backup does not
// provision any in-cluster download infrastructure.
message NFSLocation {
    // NFS server address as configured on the BackupLocation.
    // Example: "10.38.42.100" or "nfs.customer.com".
    string server = 1;

    // NFS export path on the server -- the client mounts server:export_path.
    // Sourced from BackupLocationInfo.path.
    // Example: "/exports".
    string export_path = 2;

    // Path to the CR file relative to the mount point. Server derives:
    //   <NFSConfig.sub_path>/restore-crs/<restore-name>-<short-uid>.json
    // The sub_path prefix is folded in server-side so the client only sees
    // one path to concatenate: <mount>/<file_path>.
    string file_path = 3;

    // Suggested NFS mount options (matches the BL's own configuration).
    // Example: "vers=4,rsize=1048576,wsize=1048576".
    // Optional -- empty string means "use client defaults".
    string mount_options = 4;
}

// Define RestoreCreateRequest struct
message RestoreCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // backup is deprecated, not to be used.
    string backup = 2;
    // uid or name of cluster
    string cluster = 3;
    // mapping of the namespaces from the backup to which restore should be done
    // should be used only when restore is done without using filter
    // set namespace_mapping key = value if is_sfr is set to true
    map<string, string> namespace_mapping = 4;
    // replace policy to use if the resource already exists
    ReplacePolicy.Type replace_policy = 5;
    // optional resource types to be restored (eg Jobs)
    repeated string include_optional_resource_types = 6;
    // List of resources to restore (optional)
    repeated ResourceInfo include_resources = 7;
    // storage class mapping for generic backup <source, destination>
    map<string, string> storage_class_mapping = 8;
    // backup object reference having name and id
    ObjectRef backup_ref = 9;
    // mapping of the rancher projects from the backup to which restore should
    // be done
    map<string, string> rancher_project_mapping = 10;
    // mapping of source rancher project display names to target rancher project display names
    map<string, string> rancher_project_name_mapping = 11;
    ObjectRef cluster_ref = 12;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 13;
    // List of resources to exclude from restore.
    repeated ResourceInfo exclude_resources = 14;
    // Filter options
    Filter filter = 15;
    // VirtualMachine Restore Options
    VirtualMachineRestoreOptions virtual_machine_restore_options = 16;
    // Set it to true if restore is for virtualMachine file level restore
    bool is_sfr = 17;
    // File level restore info details if is_sfr is set to true
    FileLevelRestoreInfo file_level_restore_info = 18;
    // target_namespace_prefix will be used to prefix all the target namespaces created during restore using filter
    // This will be ignored when restore is done without using filter
    string target_namespace_prefix = 19;

    // Filter to apply on resources
    message Filter {
        // resource filter
        oneof resource_filter {
            NamespaceFilter namespace_filter = 1;
            VirtualMachineFilter virtual_machine_filter = 2;
        }
    }

    message BackupObjectType {
        Type type = 1;
         enum Type {
             Invalid = 0;
             All = 1; // for All application backup
             VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
         }
     }

    message VirtualMachineRestoreOptions {
        // Skip mac address masking while restoring VirtualMachines
        bool skip_mac_masking = 1;
        // Skip VM restart during virtualMachine restore
        bool skip_vm_restart = 2;
    }
}

