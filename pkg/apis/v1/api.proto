// Define BackupScheduleCreateRequest struct
message BackupScheduleCreateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // schedule_policy is deprecated, not to be used
    string schedule_policy = 2;
    BackupScheduleInfo.ReclaimPolicyType reclaim_policy = 3;
    // Name of BackupLocation, is deprecated. Not to be used
    string backup_location = 4;
    // Name of Cluster
    string cluster = 5;
    // Namespaces to backup. Only an admin can provide multiple namespaces
    repeated string namespaces = 6;
    // Label selectors to choose resources
    map<string, string> label_selectors = 7;
    // pre_exec_rule and post_exec_rule are deprecated. Not to be used.
    string pre_exec_rule = 8;
    string post_exec_rule = 9;
    // List of resources to backup (optional)
    repeated ResourceInfo include_resources = 10;
    // Snapshot class name to use for backup schedule (optional)
    // deprecated, not to be used.
    string csi_snapshot_class_name = 11;
    // List of resource types to backup (optional)
    repeated string resource_types = 12;
    ObjectRef schedule_policy_ref = 13;
    ObjectRef backup_location_ref = 14;
    ObjectRef pre_exec_rule_ref = 15;
    ObjectRef post_exec_rule_ref = 16;
    // To get type of backup (generic or non-generic)
    BackupType backup_type = 17;
    string ns_label_selectors = 18;
    ObjectRef cluster_ref = 19;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 20;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 21;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 22;
    // option to take backup as direct kdmp
    bool direct_kdmp = 23;
    repeated string exclude_resource_types = 24;
    // option to enable parallel schedule backups.
    bool parallel_backup = 25;
    // option to enable to keep the CR status of the resources in the backupschedule.
    bool keep_cr_status = 26;
    // older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 27;
    // reference to volumeResourceOnly policy object
    ObjectRef volume_resource_only_policy_ref = 28;

    enum BackupType {
        Invalid = 0;
        Generic = 1;
        Normal = 2;
    }
    message BackupObjectType {
        Type type = 1;
        enum Type {
            Invalid = 0;
            All = 1; // for All application backup
            VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
        }
    }
}

// Define BackupScheduleCreateResponse struct
message BackupScheduleCreateResponse {
    BackupScheduleObject backup_schedule = 1;
}

// BackupScheduleRunState is the run state of a backup schedule (running vs suspended),
// used to filter bulk suspend/resume and delete operations.
enum BackupScheduleRunState {
    // Invalid or unspecified run state; ignored when used as a filter value.
    BackupScheduleRunStateInvalid = 0;
    // Schedule is actively running (not suspended).
    BackupScheduleRunStateRunning = 1;
    // Schedule is suspended.
    BackupScheduleRunStateSuspended = 2;
}

// BackupScheduleFilterOptions carries the selectors used to pick which backup schedules a bulk
// BackupSchedule Update (suspend/resume) or Delete operation acts on. It is distinct from the
// fields that set values on the schedules themselves, so a new bulk selector can be added here
// without adding another top-level field to every request. Every field documents its access level:
// whether it is available to all users or restricted to Super Admin.
// This message is common to both the Update and Delete operations, wrapped by
// BackupScheduleUpdateFilterOptions and BackupScheduleDeleteFilterOptions.
message BackupScheduleFilterOptions {
    // Filter schedules by the volumeResourceOnly policy they reference.
    // Mirrors EnumerateOptions.volume_resource_only_policy_ref, so the same
    // filter the Schedules page applies can be sent with a bulk operation.
    repeated ObjectRef volume_resource_only_policy_ref = 1;
    // [Access: Super Admin only] Owner uids to scope the operation to schedules owned by these
    // users. Empty = no owner filter.
    repeated string owners = 2;
    // [Access: All users] Backup locations to scope the operation to. Matches on name (and uid
    // when provided). Empty = no backup-location filter.
    repeated ObjectRef backup_location_refs = 3;
}

// BackupScheduleUpdateFilterOptions carries the selectors used to pick which
// backup schedules a bulk update acts on. It wraps the common
// BackupScheduleFilterOptions so update-specific selectors can be added here
// later without changing the shared message or the delete filter.
message BackupScheduleUpdateFilterOptions {
    // Common bulk selectors shared with the delete filter.
    BackupScheduleFilterOptions filter_options = 1;
}

// BackupScheduleDeleteFilterOptions carries the selectors used to pick which
// backup schedules a bulk delete acts on. It wraps the common
// BackupScheduleFilterOptions so delete-specific selectors can be added here
// later without changing the shared message or the update filter.
message BackupScheduleDeleteFilterOptions {
    // Common bulk selectors shared with the update filter.
    BackupScheduleFilterOptions filter_options = 1;
    // [Access: All users] Run state to scope the delete. A schedule is either Running or
    // Suspended; unspecified = no run-state filter.
    BackupScheduleRunState status = 2;
}

// Define BackupScheduleUpdateRequest struct
message BackupScheduleUpdateRequest {
    CreateMetadata metadata = 1 [ (gogoproto.embed) = true ];
    // schedule_policy is deprecated, not to be used
    string schedule_policy = 2;
    BackupScheduleInfo.ReclaimPolicyType reclaim_policy = 3;
    // Name of BackupLocation, is deprecated. Not to be used
    string backup_location = 4;
    // Name of Cluster
    string cluster = 5;
    // Namespaces to backup. Only an admin can provide multiple namespaces
    repeated string namespaces = 6;
    // Label selectors to choose resources
    map<string, string> label_selectors = 7;
    // pre_exec_rule and post_exec_rule are deprecated. Not to be used.
    string pre_exec_rule = 8;
    string post_exec_rule = 9;
    bool suspend = 10;
    // List of resources to backup (optional)
    repeated ResourceInfo include_resources = 11;
    // Snapshot class name to use for backup schedule (optional)
    // deprecated, not to be used.
    string csi_snapshot_class_name = 12;
    ObjectRef schedule_policy_ref = 13;
    ObjectRef backup_location_ref = 14;
    ObjectRef pre_exec_rule_ref = 15;
    ObjectRef post_exec_rule_ref = 16;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 17;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 18;
    // option to enable parallel schedule backups.
    bool parallel_backup = 19;
    // advanced_resource_label_selector - older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 20;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 21;
    // multiple policy reference for filtering
    repeated ObjectRef policy_ref = 22;
    // List of exact backup schedules to exclude (name + UID required).
    repeated ObjectRef exclude_objects = 23;
    // List of exact backup schedules to include (name + UID required).
    repeated ObjectRef include_objects = 24;
    // Substring or regex pattern to match backup schedules and include (e.g. "*" for All, "pxb-" or any valid regex)
    // Cannot be used with include_objects.
    string include_filter = 25;
    // Substring or regex pattern to match backup schedules and exclude (e.g. "*" for All, "pxb-" or any valid regex)
    // Cannot be used with exclude_objects.
    string exclude_filter = 26;
    // option to provide clusterRef to suspend/resume the backupschedule from cluster
    ClusterScope cluster_scope = 27;
    // reference to volumeResourceOnly policy object
    ObjectRef volume_resource_only_policy_ref = 28;
    // User remarks for this update operation
    string remark = 29;
    // bulk_uid_check_relaxation - This flag needs to be set to relax the UID check for bulk update operations.
    // In a bulk operation, the user will pass multiple filter options to select a list of BackupSchedule objects.
    // For example, the user may send a schedulePolicyRef object to filter BackupSchedules that use that SchedulePolicy.
    // If the user provides only the name in the schedulePolicyRef, and there are multiple SchedulePolicy objects with the same name,
    // we cannot return an error. Therefore, we require the user to explicitly confirm acceptance of the side effects of UID relaxation.
    bool bulk_uid_check_relaxation = 30;
    string ns_label_selectors = 31;
    // Selectors narrowing which schedules a bulk update acts on. Distinct from
    // volume_resource_only_policy_ref above, which sets the volumeResourceOnly
    // policy on the schedule being updated.
    BackupScheduleUpdateFilterOptions filter_options = 32;
}

