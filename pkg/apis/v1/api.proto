    // Cloud provider type
    enum Provider {
        Invalid = 0;
        AWS = 1;
        Azure = 2;
        Google = 3;
    }

    oneof Config {
        AWSConfig aws_config = 100;
        GoogleConfig google_config = 101;
        AzureConfig azure_config = 102;
    }

