/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";

option go_package = "api";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "pkg/apis/v1/common.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (gogoproto.populate_all) = true;
option (gogoproto.equal_all) = true;
option (gogoproto.testgen_all) = true;
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    security_definitions : {
        security : {
            key : "bearer"
            value : {
                type : TYPE_API_KEY
                in : IN_HEADER
                name : "Authorization"
                description : "Authentication token, prefixed by Bearer: "
                              "Bearer <token>"
            }
        }
    }
    security : {security_requirement : {key : "bearer"}}
};

message OrganizationObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
}

message ClusterInfo {
    PXConfig px_config = 1 [ (gogoproto.jsontag) = "pxconfig" ];
    string kubeconfig = 2 [
        (gogoproto.jsontag) = "kubeconfig",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 3;
    StatusInfo status = 4;
    // delete_backups indicates whether  backups created by cluster owner that belong to the cluster need to
    // be deleted or retained. This flag can be set by cluster owner with any role during cluster deletion
    bool delete_backups = 5;
    // delete_restores will determine whether the restore
    // belong to given cluster needs to be deleted or not.
    bool delete_restores = 6;
    string stork_version = 7;
    ObjectRef cloud_credential_ref = 8;
    BackupShare add_backup_share = 9;
    BackupShare del_backup_share = 10;
    BackupShareStatusInfo backup_share_status_info = 11;
    repeated string owner_group_list = 12;
    ObjectRef platform_credential_ref = 13;
    // Teleport cluster ID
    string teleport_cluster_id = 14;
    // Tenant ID
    string tenant_id = 15;
    string service_token = 16 [
        (gogoproto.jsontag) = "servicetoken",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    Provider provider = 17;
    string k8s_version = 18;
    // map[user]BackupShare details for shared user of the cluster
    // contains cluster level backup shared by non owner of the cluster
    map<string, BackupShare> add_user_backup_share = 19;
    // contains map[user]BackupShare details to be deleted for cluster level backups of
    // non owner of the cluster
    map<string, BackupShare> del_user_backup_share = 20;
    // deleted_by uid of the user who initiated cluster delete
    string deleted_by = 21;
   // delete_all_cluster_backups indicates whether all the backups(created by cluster owner, super admins and all the shared users)
   // on the cluster need to be deleted or retained. This flag can be set only by SuperAdmin while deleting the cluster
    bool delete_all_cluster_backups = 22;
    // time_zone is the time zone of the cluster
    string time_zone = 23;
    // Provider-specific cluster information for clusters discovered or managed
    // by external providers (e.g., Gardener).
    // This field is populated based on how the cluster was discovered/added.
    ClusterProviderInfo provider_info = 24;
    // Map of BackupLocations that reference this cluster with their validation status.
    // Key format: "blName/blUID" — matches the ObjectRef used in BackupLocationInfo.cluster_refs
    // This enables bidirectional reference: Cluster → BackupLocation
    // System-managed field (not user input) - populated during validation.
    map<string, BackupLocationRefStatus> backup_location_ref_status = 25;
    // Unique identifier of the storage cluster (e.g., Portworx ClusterUID) running on the onboarded cluster.
    // This is populated during cluster onboarding if a storage cluster is found.
    string application_cluster_uuid = 26;

    // ClusterProviderInfo is a polymorphic wrapper for provider-specific cluster information.
    // Use the oneof to determine which provider type is set.
    message ClusterProviderInfo {
        oneof info {
            // Gardener Shoot cluster information for clusters discovered from Gardener.
            GardenerShootInfo gardener_shoot_info = 1;
        }
    }

    // Message for maintaining status of the cluster.
    message StatusInfo {
        enum Status {
            Invalid = 0;
            Online = 1;
            Offline = 2;
            DeletePending = 3;
            // Pending If a cluster addition is in pending state
            Pending = 4;
            // Failed If a cluster failed to be added
            Failed = 5;
            // Success If cluster was successfully added but not Online yet
            Success = 6;
        }
        Status status = 1;
        string reason = 2;
    }

    // Message for maintaining status of the backup share.
    message BackupShareStatusInfo {
        Status status = 1;
        string reason = 2;

        enum Status {
            Invalid = 0;
            // InProgress if backupshare is going on for backups belonging to
            // the cluster
            InProgress = 1;
            // Failed if backupshare fails for some backups belonging to the
            // cluster
            Failed = 2;
            // Success if backupshare is successful for all current backups
            // belonging to the cluster
            Success = 3;
            // Parital Success if backupshare is successful for only few
            // backups.
            PartialSuccess = 4;
        }
    }

    // Cloud provider type
    enum Provider {
        Invalid = 0;
        AWS = 1;
        Azure = 2;
        Google = 3;
        IBM = 4;
        Rancher = 5;
        // Harvester is an HCI cluster built on RKE2.
        Harvester = 6;
        Other = 999;
    }

    // GardenerShootInfo contains Gardener-specific information for clusters
    // discovered from Gardener Shoot clusters.
    message GardenerShootInfo {
        // Name of the Gardener project this Shoot belongs to.
        string project_name = 1;
        // Name of the Shoot cluster in Gardener.
        string shoot_name = 2;
        // Name of the Seed cluster that hosts this Shoot's control plane.
        string seed_name = 3;
        // Labels from the Shoot custom resource in Gardener.
        map<string, string> labels = 4;
        // Cloud provider type where the Shoot cluster is running.
        // Extracted from the Shoot CR's spec.provider.type field.
        // Examples: "aws", "gcp", "azure"
        string cloud_provider_type = 5;
        // References to the ClusterDiscoveryConfigs that discovered this cluster.
        // This is empty if the cluster was added directly (not via discovery).
        // A cluster can be discovered by multiple ClusterDiscoveryConfigs if their
        // label selectors overlap.
        repeated ObjectRef cluster_discovery_config_refs = 6;
        // Expiration timestamp of the Shoot kubeconfig.
        // The kubeconfig needs to be refreshed before this time.
        google.protobuf.Timestamp expiration_timestamp = 7;
        // Timestamp when the kubeconfig was obtained from Gardener.
        // Used to track kubeconfig freshness and determine refresh timing.
        google.protobuf.Timestamp kubeconfig_obtained_at = 8;
        // Indicates whether the Gardener Shoot cluster is actively managed by PX-Backup.
        // Set to true if the required label used to onboard this cluster still exists
        // on the Shoot CR. Set to false if the cluster is managed by PX-Backup but
        // the required label is missing (e.g., removed externally).
        bool managed = 9;
    }

}

message ClusterObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    ClusterInfo clusterInfo = 2
        [ (gogoproto.jsontag) = "clusterinfo", (gogoproto.embed) = true ];
}

message PXConfig {
    string access_token = 1 [ (gogoproto.jsontag) = "accesstoken" ];
}

message AWSConfig {
    string access_key = 1 [ (gogoproto.jsontag) = "accesskey" ];
    string secret_key = 2 [
        (gogoproto.jsontag) = "secretkey",
        (gogoproto.moretags) = "secure:\"true\""
    ];
}

message IBMConfig {
    string api_key = 1 [
        (gogoproto.jsontag) = "api_key",
        (gogoproto.moretags) = "secure:\"true\""
    ];
}

message RancherConfig {
    string endpoint = 1 [ (gogoproto.jsontag) = "endpoint" ];
    string token = 2 [
        (gogoproto.jsontag) = "token",
        (gogoproto.moretags) = "secure:\"true\""
    ];
}

message S3Config {
    // S3 endpoint URL.
    // For AWS Workload Identity (use_workload_identity=true on AWS): ignored;
    // the AWS SDK derives the regional endpoint from the region.
    string endpoint = 1;
    // S3 region.
    // For AWS Workload Identity (use_workload_identity=true on AWS): optional.
    // If set, this value is used; otherwise the region is sourced from the
    // stork pod env (AWS_REGION, then AWS_DEFAULT_REGION).
    string region = 2;
    // Disable TLS for S3 traffic (used with HTTP-only S3-compatible stores).
    // For AWS Workload Identity (use_workload_identity=true on AWS): ignored;
    // TLS is always enforced.
    bool disable_ssl = 3;
    bool disable_path_style = 4;
    string storage_class = 5;
    // Server side encryption type name
    // Currently supporting only SSE-S3 and SSE-KMS type alone.
    Sse sse_type = 6;
    // Azure environment type
    // Currently supporting only AZURE_GLOBAL and AZURE_CHINA
    AzureEnvironmentType azure_environment = 7;
    // Azure resource group name. This is needed in the case of azure immutable bucket to get the retention period (optional)
    string azure_resource_group_name = 8;

    // Azure storage account name.
    // For Federated Identity (Workload Identity): Provide the account name here in the backup location.
    //   - When using federated identity authentication, the account name must be specified in the backup location
    //     because the AzureConfig credential object only contains client_id, tenant_id.
    // For Non-Federated Identity: Provide the account name in the AzureConfig credential object.
    //   - When using traditional authentication with client secret, the account name should be
    //     specified in the AzureConfig cloud credential object along with account_key or client_secret.
    string azure_account_name = 9 [
        (gogoproto.jsontag) = "azureaccountname",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Azure subscription ID.
    // For Federated Identity (Workload Identity): Provide the subscription ID here in the backup location.
    //   - When using federated identity authentication, the subscription ID must be specified in the backup location.
    // For Non-Federated Identity: Provide the subscription ID in the AzureConfig credential object.
    //   - When using traditional authentication, the subscription ID should be specified in the
    //     AzureConfig cloud credential object.
    string azure_subscription_id = 10 [
        (gogoproto.jsontag) = "azuresubscriptionid",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Google Cloud project ID.
    // For Federated Identity (Workload Identity): Required. Provide the project ID here in the backup location
    //   because no GoogleConfig cloud credential object is referenced.
    // For Non-Federated Identity: Not required. The project ID is automatically extracted from the
    //   JSON key in the GoogleConfig cloud credential object.
    string google_project_id = 11 [
        (gogoproto.jsontag) = "googleprojectid",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    message AzureEnvironmentType {
        Type type = 1;
        enum Type {
            Invalid = 0;
            // Azure public environment
            AZURE_GLOBAL = 1;
            // Azure china environment
            AZURE_CHINA = 2;
        }
    }
    enum Sse {
        Invalid = 0;
        // Server-side encryption with AWS S3 managed keys
        SSE_S3 = 1;
        // Server-side encryption with AWS Key Management Service
        SSE_KMS = 2;
    }
}

// AzureConfig defines the Azure cloud credential configuration.
// This supports both Federated Identity (Workload Identity) and Non-Federated Identity authentication.
message AzureConfig {
    // Azure storage account name.
    // For Non-Federated Identity: Required. Provide the account name here.
    //   - When using traditional with account_key or client_secret,
    //     the account name must be specified in this credential object.
    string account_name = 1;
    // Azure storage account key.
    // For Non-Federated Identity (Storage Account Key authentication): Required when using account key authentication.
    //   - Provide the storage account key for direct storage account access.
    string account_key = 2 [
        (gogoproto.jsontag) = "accountkey",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Azure client secret.
    // For Non-Federated Identity: Required when using service principal authentication.
    //   - Provide the client secret along with client_id and tenant_id.
    string client_secret = 3 [
        (gogoproto.jsontag) = "clientsecret",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Azure client ID (Application ID).
    // For Non-Federated Identity: Required when using service principal.
    //   - This is the Application (client) ID from Azure AD app registration.
    string client_id = 4 [
        (gogoproto.jsontag) = "clientid",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Azure tenant ID (Directory ID).
    // For Non-Federated Identity: Required when using service principal.
    //   - This is the Directory (tenant) ID from Azure AD.
    string tenant_id = 5 [
        (gogoproto.jsontag) = "tenantid",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // Azure subscription ID.
    // For Non-Federated Identity: Provide the subscription ID here.
    //   - When using traditional authentication, specify the subscription ID in this credential object.
    string subscription_id = 6 [
        (gogoproto.jsontag) = "subscriptionid",
        (gogoproto.moretags) = "secure:\"true\""
    ];
}

message GoogleConfig {
    string project_id = 1;
    string json_key = 2 [
        (gogoproto.jsontag) = "jsonkey",
        (gogoproto.moretags) = "secure:\"true\""
    ];
}

message CloudCredentialInfo {
    Type type = 1;

    enum Type {
        Invalid = 0;
        AWS = 1;
        Azure = 2;
        Google = 3;
        IBM = 4;
        Rancher = 5;
    }

    oneof config {
        AWSConfig aws_config = 100;
        AzureConfig azure_config = 101;
        GoogleConfig google_config = 102;
        IBMConfig ibm_config = 103;
        RancherConfig rancher_config = 104;
    }
}

message CloudCredentialObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    CloudCredentialInfo cloud_credential_info = 2;
}

message VolumeResourceOnlyPolicyInfo {
  enum VolumeType {
    Invalid = 0;
    Portworx = 1;
    Csi = 2;
    Nfs = 3;
  }
  // List of volumeType to be skipped for backing up the volume data
  repeated VolumeType volume_types = 1;
  // List of CSI drivers that need to used to skip the backing up of volume data
  // This parameter is valid only when the volume type is set with csi as one of the parameter
  repeated string csi_drivers = 2;
  // List of NFS servers that need to used to skip the backing up of volume data in the case of NFS volumes
  // This parameter is valid only when the volume type is set with nfs as one of the parameter
  repeated string nfs_servers = 3;
}


message VolumeResourceOnlyPolicyObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    VolumeResourceOnlyPolicyInfo volume_resource_only_policy_info = 2;
}

message SchedulePolicyInfo {
    IntervalPolicy interval = 1;
    DailyPolicy daily = 2;
    WeeklyPolicy weekly = 3;
    MonthlyPolicy monthly = 4;
    // list of backup schedule object that uses this schedule policy.
    repeated string backup_schedule = 5;
    // for_object_lock should be set, if this policy is planned to be used with
    // locked bucket while taking backup.
    bool for_object_lock = 6;
    // auto-delete - this option is to indicate, whether the backup
    // should be deleted after the retention of the backup object is expired
    bool auto_delete = 7;
    // supports_advanced_features - this option is to indicate, whether the policy is created with advanced feature support multiday, biweekly, relative and selective monthly
    bool supports_advanced_features = 8;

    message IncrementalCount {
        uint64 count = 1 [ (gogoproto.jsontag) = "count" ];
    }

    message IntervalPolicy {
        // Interval in minutes at which an action should be triggered.
        int64 minutes = 1;
        // Number of objects to retain for interval policy, default value is 10.
        int64 retain = 2;
        // Number of incremental snapshots to take before taking a full
        // snapshot.
        IncrementalCount incremental_count = 3;
    }

    message DailyPolicy {
        // Time, when the policy should be triggered. Expected format is
        // time.Kitchen eg 12:04PM or 12:04pm.
        string time = 1;
        // Number of objects to retain for daily policy, default value is 10.
        int64 retain = 2;
        // Number of incremental snapshots to take before taking a full
        // snapshot.
        IncrementalCount incremental_count = 3;
    }

    message WeeklyPolicy {
        // Day of the week when the policy should be triggered.
        // For example, sunday or sun
	    // Multiple days can be configured in the weekly policy. Multiple days can be passed in the day string with comma seperated.
	    // For example, sunday,monday or sun,mon or Sun,Mon or Sunday,Monday
        string day = 1;
        // Time, when the policy should be triggered. Expected format is
        // time.Kitchen eg 12:04PM or 12:04pm.
        string time = 2;
        // Number of objects to retain for weekly policy, default value is 5.
        int64 retain = 3;
        // Number of incremental snapshots to take before taking a full
        // snapshot.
        IncrementalCount incremental_count = 4;
	    // bi_weekly flag need to be enabled, if schedule need to happen on alternate week.
	    // By default, it will false. That means the schedule will happen every week.
	    bool bi_weekly = 5;
    }

    message MonthlyPolicy {
        // Date of the month when the policy should be triggered. If a given date
	    // doesn't exist in a month, it will be skipped. For example, if 30 is specified,
	    // it'll be skipped in February.
        // This field is deprecated, not to be used.
        int64 date = 1;
        // Time, when the policy should be triggered. Expected format is
        // time.Kitchen eg 12:04PM or 12:04pm.
        // This field is deprecated, not to be used.
        string time = 2;
        // Number of objects to retain for monthly policy, default value is 12.
        // This field is deprecated, not to be used.
        int64 retain = 3;
        // Number of incremental snapshots to take before taking a full snapshot.
        // This field is deprecated, not to be used.
        IncrementalCount incremental_count = 4;
	    oneof monthly_policy {
            RelativeMonthlyPolicy relative_monthly_policy = 100;
            SelectiveMonthlyPolicy selective_monthly_policy = 101;
        }

	    message SelectiveMonthlyPolicy {
		    // Date of the month when the policy should be triggered. If a given date
	        // doesn't exist in a month, it will be skipped. For example, if 30 is specified,
	        // it'll be skipped in February.
		    int64 date = 1;
		    // Time, when the policy should be triggered. Expected format is
		    // time.Kitchen eg 12:04PM or 12:04pm.
		    string time = 2;
		    // Number of objects to retain for monthly policy, default value is 12.
		    int64 retain = 3;
		    // Number of incremental snapshots to take before taking a full snapshot.
		    IncrementalCount incremental_count = 4;
		    // months specify the list months on which schedule needs to be taken.
		    // If it is empty, the schedule will be taken on every month of the year.
		    // months will take comma seperated multiple month value.
            // For example, jan,feb or Jan,Feb or january,february or January,February
		    string months = 5;
	    }

	    message RelativeMonthlyPolicy {
            // Usually every weekday is repreated atleast four times in any month and few week days
            // are repeated 5 times. Hence we have given both fourth and last as an option.
            // In Nov 2025, fourth sun != last sun, fourth mon = last mon
            // In case of February in a non-leap year, each week day is repeated exactly 4 times.
            // So, both fourth and last option becomes same. fourth sun = last sun
		    enum weeklyIndex {
			    Invalid = 0;
			    first = 1;
			    second  = 2;
			    third = 3;
			    fourth = 4;
			    last = 5;
		    }
		    // Relative day of relative week, Only one day can be specified.
		    // For example, sun or mon
		    string day = 1;
		    weeklyIndex weekly_index = 2;
		    // Time, when the policy should be triggered. Expected format is
		    // time.Kitchen eg 12:04PM or 12:04pm.
		    string time = 3;
		    // Number of objects to retain for monthly policy, default value is 12.
		    int64 retain = 4;
		    // Number of incremental snapshots to take before taking a full snapshot.
		    IncrementalCount incremental_count = 5;
	    }
    }
}

message SchedulePolicyObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    SchedulePolicyInfo schedule_policy_info = 2 [ (gogoproto.embed) = true ];
}

message BackupScheduleInfo {
    // schedule_policy is deprecated, not to be used.
    string schedule_policy = 1;
    bool suspend = 2;
    ReclaimPolicyType reclaim_policy = 3;
    map<string, StatusInfoList> backup_status = 4;
    // Name of BackupLocation, is deprecated. Not to be used.
    string backup_location = 5;
    // Name of Cluster
    string cluster = 6;
    // Namespaces to backup. Only an admin can provide multiple namespaces
    repeated string namespaces = 7;
    // Label selectors to choose resources
    map<string, string> label_selectors = 8;
    // pre_exec_rule and post_exec_rule is deprecated. Not to be used.
    string pre_exec_rule = 9;
    string post_exec_rule = 10;
    bool delete_backups = 11;
    StatusInfo status = 12;
    SuspendedBy suspended_by = 13;
    repeated ResourceInfo include_resources = 14;
    string stork_version = 15;
    // deprecated, not to be used.
    string csi_snapshot_class_name = 16;
    repeated string resource_types = 17;
    ObjectRef schedule_policy_ref = 18;
    ObjectRef backup_location_ref = 19;
    ObjectRef pre_exec_rule_ref = 20;
    ObjectRef post_exec_rule_ref = 21;
    // To get type of backup (generic or non-generic)
    BackupType backup_type = 22;
    // Label selectors to choose namespaces
    string ns_label_selectors = 23;
    // Target namespace of CR
    string target_namespace = 24;
    ObjectRef cluster_ref = 25;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 26;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 27;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 28;
    // option to take backup as direct kdmp
    bool direct_kdmp = 29;
    repeated string exclude_resource_types = 30;
    // option to enable parallel schedule backups.
    bool parallel_backup = 31;
    // option to enable to keep the CR status of the resources in the backupschedule.
    bool keep_cr_status = 32;
    // older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 33;
    // reference to volumeResourceOnly policy object
    ObjectRef volume_resource_only_policy_ref = 34;
    // Last remark made during update operations
    Remark remark = 35;
    // Namespaces that were unavailable in the cluster at the time of the last scheduled backup.
    repeated string missing_namespaces = 36;
    // Namespaces from a static-list VM backup that had no matching VMs (empty ns or ARLS-filtered).
    repeated string namespaces_without_matching_vms = 37;


    message BackupType {
        Type type = 1;
        enum Type {
            Invalid = 0;
            Generic = 1;
            Normal = 2;
        }
    }

    message SuspendedBy {
        Source source = 1;
        enum Source {
            Invalid = 0;
            User = 1;
            LicenseCheck = 2;
        }
    }

    message StatusInfoList { repeated StatusInfo status = 1; }

    message StatusInfo {
        // backup name
        string backup_name = 1;
        google.protobuf.Timestamp create_time = 2;
        google.protobuf.Timestamp finish_time = 3;
        Status status = 4;
        string Reason = 5;
        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Aborted = 3;
            Failed = 4;
            Deleting = 5;
            Success = 6;
            Captured = 7;
            PartialSuccess = 8;
            DeletePending = 9;
            Suspending = 10;
            Resuming = 11;
        }
    }

    enum ReclaimPolicyType {
        Invalid = 0;
        Delete = 1;
        Retain = 2;
    }
    message BackupObjectType {
        Type type = 1;
         enum Type {
             Invalid = 0;
             All = 1; // for All application backup
             VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
         }
     }
}

message BackupScheduleObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    BackupScheduleInfo backup_schedule_info = 2 [ (gogoproto.embed) = true ];
}

message NFSConfig {
    string server_addr = 1;
    string sub_path = 2;
    string mount_option = 3;
}

message completionTimeInfo {
    // This will store timestamp for the completion of volumes
    google.protobuf.Timestamp volumes_completion_time = 1;
    // This will store timestamp for the completion of resources
    google.protobuf.Timestamp resources_completion_time = 2;
    // This will store the total completion time of the entire backup/restore
    google.protobuf.Timestamp total_completion_time = 3;
}

// Per-cluster validation status map.
// Only used when use_workload_identity=true (Workload Identity mode).
// Key format: "name/uid" if both name and uid provided in cluster_refs ObjectRef,
//             "name" if only name provided (uid is optional in ObjectRef)
// Example keys: "cluster-1/abc123" or "cluster-1"
// Value: ClusterValidationStatus with status, reason, last_validation_time
// System-managed field (OUTPUT) - populated by validation results.
message ClusterValidationStatus {
    // Validation status information
    StatusInfo status_info = 1;

    // Cloud provider type where the wli enabled cluster is running.
    // Examples: "aws", "gcp", "azure"
    string cloud_provider_type = 2;

    // StatusInfo contains validation status details
    message StatusInfo {
        // Cluster validation status
        ClusterValidationState status = 1;
        // Last time validation was performed
        google.protobuf.Timestamp last_validation_time = 2;
        // Reason for the backuplocation validation failure on the given cluster
        string reason = 3;
    }

    // Canonical status values - consistent with Stork CR status and UI
    enum ClusterValidationState {
        Invalid = 0; // Invalid Value
        Pending = 1; // Validation Pending
        InProgress = 2; // Validation Inprogress
        Valid = 3; // Validation Successful
        Failed = 4; // Validation Failed
    }
}

// BackupLocationRefStatus tracks validation status of a BackupLocation on a cluster.
// Used in ClusterInfo.backup_location_ref_status map.
// Key: "blName/blUID" — the ObjectRef is encoded in the map key, so no separate field needed.
message BackupLocationRefStatus {
    // Validation status of the BackupLocation on this cluster
    BackupLocationValidationState status = 1;
    // Last time validation was performed
    google.protobuf.Timestamp last_validation_time = 2;
    // Reason for the status (especially for failures)
    string reason = 3;

    // Canonical status values - consistent with ClusterValidationStatus enum
    enum BackupLocationValidationState {
        Invalid = 0;      // Invalid Value
        Pending = 1;      // Validation Pending
        InProgress = 2;   // Validation Inprogress
        Valid = 3;        // Validation Successful
        Failed = 4;       // Validation Failed
    }
}

message BackupLocationInfo {
    // Cloud provider type for the backup location.
    // For Both Federated and Non-Federated Identity: Required.
    //   - Specifies the type of cloud provider (S3, Azure, Google, NFS).
    //   - In Federated Identity mode, this field is used to identify the cloud provider type
    //     even though no cloud credential object is referenced.
    Type type = 1;
    string path = 2;
    string encryption_key = 3 [
        (gogoproto.jsontag) = "encryptionkey",
        (gogoproto.moretags) = "secure:\"true\""
    ];
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 4;
    StatusInfo status = 5;
    bool delete_backups = 6;
    bool validate_cloud_credential = 7;
    // Reference to the cloud credential object.
    // For Non-Federated Identity: Required for Non NFS provider.
    //   - Must reference a valid CloudCredentialObject that contains the authentication credentials
    //     (e.g., AzureConfig with account_name, account_key/client_secret, client_id, tenant_id, subscription_id).
    //   - The cloud credential object provides the necessary authentication information to access the backup location.
    // For Federated Identity (Workload Identity): Not required, leave empty.
    //   - In federated identity mode, authentication is handled via workload identity/OIDC tokens,
    //     so no cloud credential object is needed.
    //   - The 'type' field is still required to specify the cloud provider type (e.g., Azure, AWS, Google).
    //   - Cloud-specific configuration (e.g., azure_account_name, azure_subscription_id) should be
    //     provided directly in the backup location's config (e.g., S3Config).
    ObjectRef cloud_credential_ref = 8;
    // Whether object lock is enabled on the backup location's bucket.
    // This is a property of the bucket, not a user choice: it is filled in by the
    // backend (derived from the bucket directly in non-federated mode, or from
    // Stork's validation result in federated mode). Any value set in the request is
    // ignored. Clients should treat this as read-only / output-only.
    bool object_lock_enabled = 9;
    // Workload Identity flag to identify if the backup location uses workload identity authentication.
    // Named to match Stork BackupLocation CR field: azureConfig.useWorkloadIdentity, s3Config.useWorkloadIdentity
    // When set to true:
    //   - Indicates that this backup location uses Workload Identity (OIDC) for authentication.
    //   - This flag is passed to the BackupLocation CR in Stork to inform it that workload identity is enabled.
    //   - Stork uses this flag to determine where to read credentials from:
    //     * If use_workload_identity=true: Stork reads cloud-specific configuration (e.g., azure_account_name, azure_subscription_id)
    //       from the backup location's config (e.g., S3Config) and uses workload identity for authentication.
    //     * If use_workload_identity=false: Stork reads credentials from the referenced cloud credential object secret (cloud_credential_ref).
    //   - When use_workload_identity=true, cloud_credential_ref should be empty or not set.
    // When set to false (default):
    //   - Indicates traditional authentication using cloud credentials stored in a CloudCredentialObject.
    //   - Stork reads authentication credentials from the cloud credential object referenced by cloud_credential_ref.
    bool use_workload_identity = 10;
    // List of clusters associated with this BackupLocation.
    // Only used when use_workload_identity=true (Workload Identity mode).
    // User provides this as INPUT when creating/updating.
    // In non-WLI mode, this field is ignored.
    repeated ObjectRef cluster_refs = 11;
    // Per-cluster validation status map.
    // Only used when use_workload_identity=true (Workload Identity mode).
    // Key format: "name/uid" if both name and uid provided in cluster_refs ObjectRef,
    //             "name" if only name provided (uid is optional in ObjectRef)
    // Example keys: "cluster-1/abc123" or "cluster-1"
    // Value: ClusterValidationStatus with status, reason, last_validation_time
    // System-managed field (OUTPUT) - populated by validation results.
    map<string, ClusterValidationStatus> cluster_status = 12;
    // Timestamp when the validation was triggered.
    // Used to implement validation timeout — if validation has been in progress
    // for longer than the configured timeout, remaining InProgress clusters are marked as Failed.
    // System-managed field (OUTPUT) - set when validation is triggered.
    google.protobuf.Timestamp validation_started_at = 15;
    // sync and the sync_info are valid only in Federated PXB deployment mode.
    // sync is used to trigger backup sync from the object store.
    // It is an on-demand sync, not automatic or periodic.
    // Note: The sync flag will be reset by the server once the backup sync operation
    // is completed for this BackupLocation. Parallel sync triggers by updating sync
    // flag while another sync is in progress are not allowed.
    bool sync = 13;
    // sync_info provides information about the sync operation including status, timing, and stats.
    SyncInfo sync_info = 14;

    // Message for maintaining status of the object.
    message StatusInfo {
        Status status = 1;
        string reason = 2;

        enum Status {
            Invalid = 0;
            Valid = 1;
            DeletePending = 2;
            ValidationInProgress = 3;
            ValidationFailed = 4;
            // If a BL is being used for partial backup, mark it as LimitedAvailability.
            LimitedAvailability = 5;
        }
    }

    // Message for maintaining information about sync operations
    message SyncInfo {
        Status status = 1;
        string reason = 2;
        // Reference to the cluster used for executing the backup sync operation
        ObjectRef cluster_ref = 3;
        // Statistics about the sync operation (timing, counts, etc.)
        SyncStats sync_stats = 4;

        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Completed = 3;
            Failed = 4;
        }

        // Statistics about the sync operation
        message SyncStats {
            // When the backup location sync operation started
            google.protobuf.Timestamp start_time = 1;
            // When the backup location sync operation ended
            google.protobuf.Timestamp end_time = 2;
        }
    }

    enum Type {
        Invalid = 0;
        S3 = 1;
        Azure = 2;
        Google = 3;
        NFS = 4;
    }

    oneof config {
        S3Config s3_config = 100;
        NFSConfig nfs_config = 101;
    }
}

message BackupLocationObject {
    Metadata metadata = 1
        [ (gogoproto.jsontag) = "metadata", (gogoproto.embed) = true ];
    BackupLocationInfo backup_location_info = 2;
}

message ResourceInfo {
    string name = 1;
    string namespace = 2;
    string group = 3;
    string kind = 4;
    string version = 5;
}

// ResourcesInfo used for VM backups
message VirtualMachineResourceInfo {
    ResourceInfo resource_info = 1 [ (gogoproto.embed) = true ];
    repeated string virtual_machine_names = 2;
}

// VirtualMachine identifies a KubeVirt VM by name + namespace.
// Reusable across per-VM status, per-VM detail, and future NS-mode wrappers.
message VirtualMachine {
    string name      = 1;
    string namespace = 2;
}

// ResourceDetail describes one owned entity (volume or non-volume resource)
// of a VM in the GetRestoreResourceDetails response. Volumes and non-volume
// resources are unified into one list, differentiated by gvk.
// For PVCs, gvk = "PersistentVolumeClaim/v1".
message ResourceDetail {
    string                 name   = 1;
    string                 gvk    = 2;  // "Kind/Group/Version"; empty group = core
    RestoreInfo.StatusInfo status = 3;  // status enum + resolved reason string
    uint64                 size   = 4; // size per pvc during restore
}

// Counts of items (volumes, resources, etc.) grouped by their status.
message StatusCounts {
    // Total number of items.
    int32 total    = 1;
    // Number of failed items.
    int32 failed   = 2;
    // Number of skipped items.
    int32 skipped  = 3;
    // Number of retained items.
    int32 retained = 4;
    // Number of deleted items.
    int32 deleted  = 5;
}

// Restore statistics broken down by volumes and resources.
message RestoreStats {
    StatusCounts volumes   = 1;
    StatusCounts resources = 2;
}

// VirtualMachineDetail is the per-VM rich view returned by GetRestoreResourceDetails.
// Identity + status fully resolved; resources is the unified list of owned entities;
// stats is the computed count breakdown. The status filter on the request
// controls which entries appear in resources.
message VirtualMachineDetail {
    VirtualMachine          vm        = 1 [ (gogoproto.embed) = true ];
    RestoreInfo.StatusInfo  status    = 2;  // status enum + resolved reason
    repeated ResourceDetail resources = 3;
    RestoreStats            stats     = 4;
    // Guest OS name of the VM (e.g. "linux", "windows"). Empty when
    // the source backup did not capture guest OS metadata.
    string                  os_name   = 5;
}

message BackupInfo {
    // Name of BackupLocation, deprecated. Not to be used.
    string backup_location = 1;
    // Name of Cluster
    string cluster = 2;
    // Namespaces to backup. Only an admin can provide multiple namespaces. This will be updated with the namespaces present at the start of the backup cycle.
    repeated string namespaces = 3;
    // Label selectors to choose resources
    map<string, string> label_selectors = 4;
    StatusInfo status = 5;
    // resourceInfo for backupObjectType Namespace
    // NOTE: This field will not be used and will be deprecated in future. Use resource_representation instead.
    repeated ResourceInfo resources = 6;
    repeated Volume volumes = 7;
    string backup_path = 8;
    Stage stage = 9;
    // pre_exec_rule and post_exec_rule are deprecated, not to be used,
    string pre_exec_rule = 10;
    string post_exec_rule = 11;
    // Name of the backup schedule, if the backup was taken by schedule through
    // px-backup.
    // Otherwise it will be empty.
    BackupSchedule backup_schedule = 12;
    string cr_name = 13;
    uint64 total_size = 14;
    // Reference to cloud credential object used for backup.
    // cloud_credential is deprecated, not to be used.
    string cloud_credential = 15;
    repeated ResourceInfo include_resources = 16;
    uint64 resource_count = 17;
    string stork_version = 18;
    // deprecated, not to be used.
    string csi_snapshot_class_name = 19;
    repeated string resource_types = 20;
    ObjectRef backup_location_ref = 21;
    ObjectRef pre_exec_rule_ref = 22;
    ObjectRef post_exec_rule_ref = 23;
    ObjectRef cloud_credential_ref = 24;
    // To get type of backup (generic or non-generic)
    BackupType backup_type = 25;
    string cr_uid = 26;
    int64 retention_period = 27;
    BackupShare backup_share = 28;
    BackupShare.AccessType user_backupshare_access = 29;
    ObjectRef cluster_ref = 30;
    string ns_label_selectors = 31;
    // Name of rancher projects associated with resources
    map<string, string> rancher_projects = 32;
    // Target namespace of CR
    string target_namespace = 33;
    // this flag signifies if the backup involves large number of resources or not
    bool large_resource_enabled = 34;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 35;
    // Skip auto rules for VirtualMachine Backup Object type
    bool skip_vm_auto_exec_rules = 36;
    // volume snapshot class mapping for csi based backup <provisioner(string), volumesnapshotclass(string)> (optional)
    map<string, string> volume_snapshot_class_mapping = 37;
    // option to take backup as direct kdmp
    bool direct_kdmp = 38;
    // this will store the timestamp, when the retention period of locked backup will be expired
    google.protobuf.Timestamp retention_time = 39;
    // this will store the completion time of the volumes, resources and total backup
    completionTimeInfo completion_time_info = 40;
    repeated string exclude_resource_types = 41;
    // this will be set when the backup has been created by a parallel backup enabled scheduled
    bool parallel_backup = 42;
    // option to enable to keep the CR status of the resources in the backup.
    bool keep_cr_status = 43;
    // This will be set when all volumes are only PXD and their local snapshots are completed and backup is ready for restore from local snapshot.
    bool isBackupReady_for_PXDLocalSnapshotRestore = 44;
    // older label selector does not support string type. Map type has contraint of supporting operator, So introducing this new parameter
    string advanced_resource_label_selector = 45;
    // schedule_policy_ref is used to get the schedule policy details for the backup
    ObjectRef schedule_policy_ref = 46;
    repeated VirtualMachineInfo virtual_machines = 47;
    int64  virtual_machines_total_count = 48;
    int64  virtual_machines_failed_count = 49;
    // this will store the reference of the parent backup in case of retry backup
    ObjectRef retry_parent = 50;
    // VirtualMachine Info
    message VirtualMachineInfo {
        string name = 1;
        string namespace = 2;
        string os_name = 3;
        StatusInfo status = 5;
    }
    // reference to volumeResourceOnly policy object
    ObjectRef volume_resource_only_policy_ref = 51;
    // resourcesInfo for backupObjectType VirtualMachine
    // NOTE: Do not use this field as it will be deprecated in future. Use resource_representation instead.
    repeated VirtualMachineResourceInfo virtual_machine_resources = 52;
   // to capture namespaces that were missing when the backup was initiated
    repeated string missing_namespaces = 53;

    // New resource representation using oneof for different resource types
    // In case of VM backup, vm_resources will be used.
    // In case of Namespace backup, namespace_resources will be used.
    oneof resource_representation {
        VirtualMachineResources vm_resources = 54;
        NamespaceResources namespace_resources = 55;
    }

    // Message for VirtualMachine resources containing list of virtual machines related resource information
    message VirtualMachineResources {
        // List of virtual machine resource information
        repeated VirtualMachineResourceInfo vms = 1;
    }

    // Message for Namespace resources
    message NamespaceResources {
        // List of namespace resources with their status, metrics, and resource type information
        repeated NamespaceResource namespaces = 1;
    }
    // resources sync status information
    SyncStatusInfo resources_sync_status_info = 56;
    // namespace sync status information
    SyncStatusInfo namespace_sync_status_info = 57;
    // Number of failed resources during backup
    uint64 failed_resource_count = 58;
    // Number of failed volumes during backup
    uint64 failed_vol_count = 59;
    // synced is true if this backup object was created by backup sync
    // (discovered in a backup location, originally created by another
    // cluster/deployment) rather than by a backup request in this deployment.
    bool synced = 60;
    // Namespaces from a static-list VM backup that had no matching VMs (empty ns or ARLS-filtered).
    repeated string namespaces_without_matching_vms = 61;
    // Message for maintaining status of sync operations
    message SyncStatusInfo {
        Status status = 1;
        string reason = 2;
         // When this status was last updated, this will be used for TTL calculation
        google.protobuf.Timestamp updated_at = 3;

        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Completed = 3;
            Failed = 4;
        }
    }

    message BackupType {
        Type type = 1;

        enum Type {
            Invalid = 0;
            Generic = 1;
            Normal = 2;
        }
    }

    message BackupSchedule {
        string uid = 1;
        string name = 2;
    }

    message Volume {
        string name = 1;
        string namespace = 2;
        string pvc = 3;
        string backup_id = 4;
        StatusInfo status = 5;
        string driver_name = 6;
        repeated string zones = 7;
        map<string, string> options = 8;
        uint64 total_size = 9;
        // actual size of the backup
        // incase of incremental, it's the incremental backup size
        uint64 actual_size = 10;
        string storage_class = 11;
        string pvc_id = 12;
        string provisioner = 13;
        string volumesnapshot = 14;
        // As part of restrictive PSA setting, if an UID or GID is used during backup then same value should be used during restore (optional)
        JobSecurityContext job_security_context = 15;
        string virtual_machine_name = 16;
        // Indicate backup mode - full/incr (for pxd volumes) or not supported (for other volume drivers)
        BackupMode backup_mode = 17;

        message JobSecurityContext {
            int64 runAsUser = 1;
            int64 runAsGroup = 2;
        }

        message BackupMode {
            Type type = 1;

            enum Type {
                Invalid = 0;
                // for non-pxd volumes
                NotSupported = 1;
                // for pxd volumes
                Full = 2;
                // for pxd volumes
                Incremental = 3;
            }
        }
    }


    // Message for maintaining status of the object.
    message StatusInfo {
        Status status = 1;
        string reason = 2;

        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Aborted = 3;
            Failed = 4;
            Deleting = 5;
            Success = 6;
            Captured = 7;
            PartialSuccess = 8;
            DeletePending = 9;
            CloudBackupMissing = 10;

        }
    }

    enum Stage {
        Invalid = 0;
        Initial = 1;
        PreExecRule = 2;
        PostExecRule = 3;
        Volumes = 4;
        Applications = 5;
        Final = 6;
    }
    message BackupObjectType {
        Type type= 1;
        enum Type {
            Invalid = 0;
            All = 1; // for All application backup
            VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
        }
    }


    // ---- Resource-Centric Backup. Next free number was 62.
    // 60 and 61 are taken by synced and namespaces_without_matching_vms. ----
    // Field 62 held resource_ref under the one-schedule-per-resource model.
    // A backup now covers many resources, so one reference cannot describe it
    // and the per-resource verdict lives in RecoveryPointInfo instead.
    reserved 62;
    reserved "resource_ref";
    // The single Protection Intent that produced it. Still correct: one
    // schedule key serves exactly one intent.
    string intent_id = 63;
    // Which equivalence class produced it, so a backup is traceable back to
    // its group. OUTPUT_ONLY.
    string schedule_key = 64;
    // Which catalog resources this backup covers. The backup is SHARED, so
    // this is its member list. Bounded by the size of one schedule group, not
    // by the fleet.
    repeated string covered_resource_uids = 65;
    // Which SLA Policy was in force, and at which revision. Retention is
    // anchored to the revision -- FR-133.
    ObjectRef sla_policy_ref = 66;
    uint64 sla_policy_revision_at_capture = 67;
    // How each volume was ACTUALLY captured, and why a preferred method was
    // not used -- FR-098. BackupInfo.volumes records what was backed up, not
    // which method moved it.
    repeated VolumeCaptureDetail volume_capture_details = 68;
    // False for a legacy backup, which has no recovery points.
    bool resource_centric = 69;
}

// Message representing resources within a namespace with status, metrics, and resource type breakdown
message NamespaceResource {
    // Namespace name
    string name = 1;
    // Status information for this namespace
    StatusInfo status = 2;
    // List of resource types in this namespace, grouped by resource type
    repeated ResourceTypeInfo resource_types = 3;
    // Statistics for this namespace
    Metrics metrics = 4;

    // Status information for namespace-level operations
    message StatusInfo {
    enum Status {
        Invalid = 0;
        InProgress = 1;
        Success = 2;
        Failed = 3;
        PartialSuccess = 4;
    }
    Status status = 1;
    string reason = 2;
    }

    // Metrics containing namespace-level statistics for resources and volumes
    message Metrics {
        // Total number of resources in this namespace
        int32 total_resources = 1;
        // Total number of volumes in this namespace
        int32 total_volumes = 2;
        // Total number of resources that failed in this namespace
        int32 total_failed_resources = 3;
        // Total number of volumes that failed in this namespace
        int32 total_failed_volumes = 4;
    }

    // ResourceTypeInfo groups resources by their resource type and organizes them into chunks
    message ResourceTypeInfo {
        // The Kubernetes resource type in the format group/version/kind (e.g., "apps/v1/Deployment")
        string name = 1;
        // List of chunks containing resources of this type
        repeated ChunkInfo chunks = 2;
        // Statistics for this resource type
        Metrics metrics = 3;

        // Metrics containing resource type-level statistics
        message Metrics {
            // Total number of resources of this type
            int32 total_resources = 1;
            // Total number of resources of this type that failed
            int32 total_failed_resources = 2;
        }
    }

    // ChunkInfo represents a processing unit containing a subset of resources of the same type in a namespace
    message ChunkInfo {
        int32 id = 1;
        // Processing status of this specific chunk
        StatusInfo status = 2;
        // List of resource names contained in this chunk
        repeated string resource_names = 3;
        // Total number of resources in this chunk
        int32 total_resources = 4;

        // Status information for chunk-level operations
        message StatusInfo {
        enum Status {
            Invalid = 0;
            InProgress = 1;
            Success = 2;
            Failed = 3;
        }
        Status status = 1;
        string reason = 2;
        }
    }
}

message NamespaceResourceObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    ObjectRef backup_ref = 2;
    repeated NamespaceResource namespaces = 3;
}

message ResourceObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    ObjectRef backup_ref = 2;
    repeated NamespaceResource namespaces = 3;
}

// Message for Backup object which will be stored in Datastore.
message BackupObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    BackupInfo backup_info = 2 [ (gogoproto.embed) = true ];
    oneof _placeholder {
      bool _unused = 50000;
    }
}

// Message for passing pre and post exec rules for backup
message RulesInfo {
    repeated RuleItem rules = 1 [ (gogoproto.moretags) = "yaml:\"rules\"" ];

    message RuleItem {
        map<string, string> pod_selector = 1
            [ (gogoproto.moretags) = "yaml:\"podSelector\"" ];
        repeated Action actions = 2
            [ (gogoproto.moretags) = "yaml:\"actions\"" ];
        string container = 3;
    }

    message Action {
        bool background = 1 [ (gogoproto.moretags) = "yaml:\"background\"" ];
        bool run_in_single_pod = 2
            [ (gogoproto.moretags) = "yaml:\"runInSinglePod\"" ];
        string value = 3;
    }
}

message RuleObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    RulesInfo rules_info = 2 [ (gogoproto.embed) = true ];
}

message ReplacePolicy {
    enum Type {
        Invalid = 0;
        Retain = 1;
        Delete = 2;
    }
}

message RestoreInfo {
    // backup is deprecated, not to be used.
    string backup = 1;
    // Name of backup location to restore from.
    // backup_location is deprecated, not to be used.
    string backup_location = 2;
    // Label selectors to choose resources
    map<string, string> label_selectors = 3;
    // Namespace Mapping
    map<string, string> namespace_mapping = 4;
    // Restore replace policy type ("delete"/"retain")
    ReplacePolicy.Type replace_policy = 5;
    StatusInfo status = 6;
    repeated RestoredResource resources = 7;
    repeated Volume volumes = 8;
    // Name of the cluster
    string cluster = 9;
    repeated string include_optional_resource_types = 10;
    uint64 total_size = 11;
    repeated ResourceInfo include_resources = 12;
    uint64 resource_count = 13;
    string stork_version = 14;
    ObjectRef backup_location_ref = 15;
    // storage class mapping for generic backup <source, destination>
    map<string, string> storage_class_mapping = 16;
    // backup to restore from
    ObjectRef backup_ref = 17;
    // mapping of the rancher projects from the backup to which restore should
    // be done
    map<string, string> rancher_project_mapping = 18;
    // mapping of source rancher project display names to target rancher project display names
    map<string, string> rancher_project_name_mapping = 19;
    // flag signifies if the restored backup involves large number of resources or not
    bool large_resource_enabled = 20;
    // counter to show number of already restored resources
    uint64 restored_resource_count = 21;
    // current activity while doing resource restore
    RestoreResourceState restore_status = 22;
    ObjectRef cluster_ref = 23;
    // backup object type is all namespace or virtualMachine specific backup
    BackupObjectType backup_object_type = 24;
    // VirtualMachine Restore Options
    VirtualMachineRestoreOptions virtual_machine_restore_options = 25;
    // Is true if restore is VirtualMachine file level restore
    bool is_sfr = 27;
    // File level restore info
    FileLevelRestoreStatusInfo file_level_restore_info = 28;
    // Filter criteria used for this restore (for audit/duplicate restore)
    Filter filter = 29;
    string target_namespace_prefix = 30;

    message RestoreResourceState {
        ResourceStatus restore_status = 1;

        enum ResourceStatus {
            Preparing = 0;
            Deleting = 1;
            Verifying = 2;
            Applying = 3;
        }

    }

    message RestoredResource {
        string name = 1;
        string namespace = 2;
        string group = 3;
        string kind = 4;
        string version = 5;
        StatusInfo status = 6;
    }

    message Volume {
        string pvc = 1;
        string source_namespace = 2;
        string source_volume = 3;
        string restore_volume = 4;
        StatusInfo status = 5;
        string driver_name = 6;
        repeated string zones = 7;
        map<string, string> options = 8;
        uint64 total_size = 9;
    }

    // Message for maintaining status of the object.
    message StatusInfo {
        enum Status {
            Invalid = 0;
            Pending = 1;
            InProgress = 2;
            Aborted = 3;
            Failed = 4;
            Deleting = 5;
            Success = 6;
            Retained = 7;
            PartialSuccess = 8;
            // Skipped applies only to volume and resource entries, not to the
            // overall restore status: the entry was intentionally not restored.
            Skipped = 9;
            // Deleted applies only to volume and resource entries, not to the
            // overall restore status: an entry that was restored and later
            // removed during cleanup because its owning object ultimately failed.
            Deleted = 10;
        }

        Status status = 1;
        string reason = 2;
    }
    message BackupObjectType {
       Type type = 1;
        enum Type {
            Invalid = 0;
            All = 1; // for All application backup
            VirtualMachine = 2; // virtualMachine for VirtualMachine specific backup
        }
    }

    message VirtualMachineRestoreOptions {
        // Skip mac address masking while restoring VirtualMachines
        bool skip_mac_masking = 1;
        // Skip VM restart during virtualMachine restore
        bool skip_vm_restart = 2;
    }

    // Per-VM restore status.
    message VirtualMachineStatusInfo {
        // Name of the virtual machine.
        string name       = 1;
        // Namespace of the virtual machine.
        string namespace  = 2;
        // Restore status of the virtual machine.
        StatusInfo status = 3;
        // Volumes owned by this virtual machine. Positions into
        // RestoreInfo.volumes. Empty for namespace-scoped restores.
        repeated int32 volume_index = 4;
    }

    message Filter {
        oneof resource_filter {
            NamespaceFilter namespace_filter = 1;
            VirtualMachineFilter virtual_machine_filter = 2;
        }
    }

    // Message for restore resources
    Resources restore_resources = 31;
    // retention_period stores the object-lock retention period in days for the restore
    // This is only set when the backup location has object lock enabled
    int64 retention_period = 32;
    // Total number of virtual machines in a virtual machine restore; 0 for
    // namespace-scoped restores.
    int64 virtual_machines_total_count = 33;
    // Count of VMs that failed; non-zero indicates partial success.
    int64 virtual_machines_failed_count = 34;
    // Per-VM restore status. Empty for namespace-scoped restores, or restores
    // created before per-VM status was supported; treat absence as "no per-VM
    // status available".
    repeated VirtualMachineStatusInfo virtual_machine_statuses = 35;

    // Message for restore resources containing list of restore resource information
    message Resources {
        // List of restore resources with their status, metrics, and resource type information
        repeated Resource resources = 1;
        // Lookup table for reasons - index into this list is used in ResourceWithReason
        repeated string reasons = 2;
    }

    // Message representing restored resources grouped by GVK
    message Resource {
        // Namespace name
        string namespace = 1;
        // Overall status information
        StatusInfo status = 2;
        // List of resource types (grouped by GVK)
        repeated ResourceTypeInfo resource_types = 3;
        // Statistics
        Metrics metrics = 4;

        // ResourceTypeInfo groups resources by their resource type (GVK)
        message ResourceTypeInfo {
            // The Kubernetes resource type in the format group/version/kind (e.g., "apps/v1/Deployment")
            string name = 1;
            // Chunks containing resources of this type
            repeated ChunkInfo chunks = 2;
            // Statistics for this resource type
            Metrics metrics = 3;

            // Metrics containing resource type-level statistics
            message Metrics {
                // Total number of resources of this type
                int32 total_resources = 1;
                // Total number of failed resources of this type
                int32 total_failed_resources = 2;
            }
        }

        // ChunkInfo represents a processing unit containing resources from the same backup chunk
        message ChunkInfo {
            // Chunk ID from backup
            int32 id = 1;
            // Resources grouped by status within this chunk
            repeated ResourceInfo resource_infos = 2;
            // Total number of resources in this chunk
            int32 total_resources = 3;

            // Resources grouped by status
            message ResourceInfo {
                // Status of the resources in this group
                Status status = 1;
                // List of resources with this status
                repeated Resource resources = 2;

                enum Status {
                    Invalid = 0;
                    Success = 1;
                    Failed = 2;
                    Retained = 3;
                    Skipped = 4;
                    Deleted = 5;
                }
            }

            // Restored resource entry.
            message Resource {
                // Name of the resource.
                string name = 1;
                // Index into the reasons table in RestoreResources (0 means no reason).
                int32 reason_index = 2;
                // Virtual machines that own this resource. Empty when the
                // resource is not owned by any virtual machine (namespace-scoped
                // restore or shared cluster-scoped resource).
                repeated int32 vm_index = 3;
            }
        }

        // Metrics containing statistics for restored resources and volumes
        message Metrics {
            // Total number of resources
            int32 total_resources = 1;
            // Total number of volumes
            int32 total_volumes = 2;
            // Total number of resources that failed
            int32 total_failed_resources = 3;
            // Total number of volumes that failed
            int32 total_failed_volumes = 4;
        }
    }

}

message FileLevelRestoreInfo {
    // Name of the virtualMachine to which file level restore needs to be performed
    string virtual_machine_name = 1;
    // PersistentVolumeClaim name. The Source volume from which files needs to be restored
    string volume_name = 2;
    // List of files to be restored from the virtualMachine volume
    repeated RestoreFileInfo restore_files = 3;
}

message FileLevelRestoreStatusInfo {
    string virtual_machine_name = 1;
    string volume_name = 2;
    repeated RestoreFileStatusInfo restore_files = 3;
}

message RestoreFileInfo {
    // Source file path. Relative path to the file with in the selected volume
    string source_path = 1;
    // Destination File path. Absolute file path where the source file needs to be restored.
    // Empty if restore to the same path as that of the source path
    string destination_path = 2;
    // True if source path is a directory path
    bool is_dir = 3;
    // Partition info of the volume where the source file exists, if  the volume is partitioned
    // For eg: vda1 or sda14
    string partition_info = 4;
}
message RestoreFileStatusInfo {
    RestoreFileInfo restore_file_info = 1 [ (gogoproto.embed) = true ];
    // Time taken to complete the copy operation
    google.protobuf.Duration duration = 2;
    // Restore status of the file with reason for failure if any
    RestoreInfo.StatusInfo status = 3;
}

// Message for Restore object which will be stored in Datastore.
message RestoreObject {
    Metadata metadata = 1 [ (gogoproto.embed) = true ];
    RestoreInfo restore_info = 2 [ (gogoproto.embed) = true ];
    repeated string reasons = 3;
}

